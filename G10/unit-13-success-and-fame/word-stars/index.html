<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Stars – G10 Unit 13 Success and fame (Parts of speech)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#ffc93c; --gold2:#ff9f1c; --mag:#ff3d9a; --cyan:#39e6ff;
  --green:#22d873; --red:#ff4d5e; --ink:#0b0620; --panel:#140a2e;
  --bar:#0a0518;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Lexend',system-ui,sans-serif;color:#fff;user-select:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0b0620}
#bg{position:absolute;inset:0;width:1920px;height:1080px}
#slides{position:absolute;left:0;top:0;width:1920px;height:990px}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s}
.slide.active{opacity:1;pointer-events:auto}
.slide.active .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
body.frozen *, body.frozen *::before, body.frozen *::after{animation-play-state:paused!important}
body.frozen .bigword{animation:none!important}

/* ===== marquee bulbs ===== */
.marquee{position:absolute}
.bulb{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff8d6 0 18%,var(--gold) 45%,#b86b00 100%);
  box-shadow:0 0 10px 3px rgba(255,201,60,.85),0 0 26px 6px rgba(255,160,30,.35);
  animation:chase 1.2s steps(1) infinite}
.bulb.d1{animation-delay:-.4s}.bulb.d2{animation-delay:-.8s}
@keyframes chase{0%{filter:brightness(1.15)}33%{filter:brightness(.35);box-shadow:none}66%{filter:brightness(.35);box-shadow:none}}

/* ===== title slide ===== */
#s-title .rays{position:absolute;left:960px;top:400px;width:1800px;height:1800px;margin:-900px 0 0 -900px;
  background:repeating-conic-gradient(from 0deg,rgba(255,201,60,.13) 0 6deg,transparent 6deg 18deg);
  border-radius:50%;-webkit-mask:radial-gradient(circle,#000 0 25%,transparent 62%);mask:radial-gradient(circle,#000 0 25%,transparent 62%);
  animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#s-title .frame{left:340px;top:120px;width:1240px;height:560px;border-radius:44px;
  background:linear-gradient(180deg,rgba(40,10,80,.92),rgba(20,6,46,.95));
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 6px #3b1a6e,inset 0 0 0 10px #ffc93c55,inset 0 0 80px rgba(255,61,154,.25)}
.bigword{position:absolute;left:0;right:0;text-align:center;font-family:'Bungee','Arial Black',Impact,sans-serif,sans-serif;line-height:1;color:#ffe9a8;
  text-shadow:0 2px 0 #f6b21c,0 4px 0 #e89a10,0 6px 0 #d2830a,0 8px 0 #b86c06,0 10px 0 #9b5804,0 12px 0 #7d4502,0 22px 30px rgba(0,0,0,.7),0 0 40px rgba(255,201,60,.55)}
#s-title .w1{top:175px;font-size:200px;letter-spacing:18px}
#s-title .w2{top:395px;font-size:200px;letter-spacing:18px;color:#ffd1ea;
  text-shadow:0 2px 0 #ff73b5,0 4px 0 #f0549e,0 6px 0 #d93d86,0 8px 0 #bd2a6e,0 10px 0 #a01d5a,0 12px 0 #7e1246,0 22px 30px rgba(0,0,0,.7),0 0 40px rgba(255,61,154,.6)}
#s-title .w1{animation:titleIn 1s cubic-bezier(.2,1.4,.4,1) both}
#s-title .w2{animation:titleIn 1s .25s cubic-bezier(.2,1.4,.4,1) both}
@keyframes titleIn{from{opacity:0;transform:scale(.4) translateY(60px)}to{opacity:1;transform:none}}
#s-title .star{position:absolute;width:150px;height:150px;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(1.18) rotate(12deg);filter:drop-shadow(0 0 30px #ffc93c)}}
#s-title .tag{position:absolute;left:50%;top:735px;transform:translateX(-50%);white-space:nowrap;
  font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:52px;padding:18px 54px;border-radius:999px;color:#1a0833;
  background:linear-gradient(180deg,#7ff4ff,#22b8e0);box-shadow:0 10px 0 #0d6f8f,0 18px 40px rgba(0,0,0,.5),0 0 40px rgba(57,230,255,.5)}
#s-title .sub{position:absolute;left:0;right:0;top:880px;text-align:center;font-size:38px;font-weight:600;color:#e8dcff;letter-spacing:1px}
#s-title .sub b{color:var(--gold)}

/* ===== how to play ===== */
.hd{position:absolute;left:0;right:0;top:46px;text-align:center;font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:76px;color:#fff;
  text-shadow:0 5px 0 #7d1fd1,0 10px 0 #4c0f87,0 18px 30px rgba(0,0,0,.6),0 0 30px rgba(180,90,255,.6)}
.hd .g{color:var(--gold)}
.steps{position:absolute;left:110px;right:110px;top:230px;display:flex;gap:46px}
.step{flex:1;height:600px;border-radius:36px;padding:44px 40px;position:relative;
  background:linear-gradient(180deg,#2a1158,#170833);box-shadow:inset 0 0 0 4px #4a2589,0 24px 50px rgba(0,0,0,.55);
  transition:transform .4s,box-shadow .4s}
.step.lit{transform:translateY(-16px) scale(1.03);box-shadow:inset 0 0 0 5px var(--gold),0 0 60px rgba(255,201,60,.55),0 30px 60px rgba(0,0,0,.6)}
.step .n{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:62px;color:#1a0833;
  background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc93c 50%,#d98a00);box-shadow:0 8px 0 #8a5300,0 0 30px rgba(255,201,60,.6)}
.step h3{font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:60px;margin:40px 0 24px;line-height:1.1}
.step p{font-size:50px;line-height:1.32;color:#eadfff;font-weight:500}
.step p b{color:var(--gold)}
.step .ic{position:absolute;right:36px;top:40px;width:120px;height:120px}

/* ===== contestant slide ===== */
.plate{position:absolute;left:70px;top:36px;display:flex;align-items:center;gap:22px;padding:14px 34px;border-radius:26px;
  background:linear-gradient(180deg,#ff5fab,#d61f78);box-shadow:0 9px 0 #8c0f4c,0 20px 40px rgba(0,0,0,.5)}
.plate .lab{font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:26px;line-height:1;color:#ffe3f1;letter-spacing:3px;margin-bottom:6px}
.plate .num{font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:78px;line-height:1;color:#fff;text-shadow:0 4px 0 #8c0f4c}
.plate .of{font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:34px;color:#ffd0e7}
.qline{position:absolute;left:420px;right:300px;top:66px;text-align:center;font-size:42px;font-weight:700;color:#efe6ff;line-height:1.2}
.qline .g{color:var(--gold)}
.panel{left:120px;top:205px;width:1680px;height:400px;border-radius:40px;
  background:linear-gradient(180deg,#22104a 0%,#12062b 100%);
  box-shadow:0 30px 70px rgba(0,0,0,.65),inset 0 0 0 5px #3d1d77,inset 0 0 0 9px rgba(255,201,60,.25),inset 0 -60px 120px rgba(255,61,154,.12)}
.sent{position:absolute;left:90px;right:90px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:76px;font-weight:600;line-height:1.38;color:#fff}
.sent>div{width:100%}
.starw{display:inline-block;position:relative;white-space:nowrap;padding:0 18px;margin:0 4px;border-radius:18px;color:#1a0833;font-weight:800;
  background:linear-gradient(180deg,#ffe58a,#ffc93c 55%,#f4a90f);box-shadow:0 6px 0 #a86700,0 0 34px rgba(255,201,60,.7);
  animation:starPulse 2.6s ease-in-out infinite}
@keyframes starPulse{50%{box-shadow:0 6px 0 #a86700,0 0 60px rgba(255,201,60,1)}}
.starw .orig{transition:all .4s}
.starw .fixw{display:inline-block;max-width:0;opacity:0;overflow:hidden;vertical-align:bottom;white-space:nowrap;transition:max-width .7s cubic-bezier(.3,1.3,.5,1),opacity .4s}
.starw .tick{display:inline-block;max-width:0;opacity:0;overflow:hidden;vertical-align:bottom;transition:max-width .5s,opacity .4s}
.starw .mini{position:absolute;left:-20px;top:-26px;width:46px;height:46px;transform:rotate(-14deg);filter:drop-shadow(0 0 10px #ffc93c)}
/* fix revealed: wrong word */
.slide:has(.fixbox.on) .starw.bad{background:linear-gradient(180deg,#bfffd8,#3fe28a 55%,#17b862);box-shadow:0 6px 0 #0b7a3e,0 0 40px rgba(34,216,115,.8);animation:none}
.slide:has(.fixbox.on) .starw.bad .orig{color:#c4122c;text-decoration:line-through;text-decoration-thickness:7px;font-size:.62em;margin-right:12px;opacity:.85}
.slide:has(.fixbox.on) .starw.bad .fixw{max-width:900px;opacity:1}
.slide:has(.fixbox.on) .starw.good{background:linear-gradient(180deg,#bfffd8,#3fe28a 55%,#17b862);box-shadow:0 6px 0 #0b7a3e,0 0 40px rgba(34,216,115,.8);animation:none}
.slide:has(.fixbox.on) .starw.good .tick{max-width:90px;opacity:1}

.verdict{position:absolute;left:120px;width:1680px;top:640px;height:140px;display:flex;justify-content:center;gap:70px}
.vbtn{width:520px;height:128px;border:none;border-radius:34px;font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:66px;cursor:pointer;color:#fff;position:relative;
  display:flex;align-items:center;justify-content:center;gap:22px;transition:transform .12s,filter .3s,box-shadow .3s,opacity .3s}
.vbtn svg{width:70px;height:70px}
.vbtn.ok{background:linear-gradient(180deg,#53f29b,#16b85f);box-shadow:0 12px 0 #0a6e38,0 22px 40px rgba(0,0,0,.5);text-shadow:0 4px 0 #0a6e38}
.vbtn.no{background:linear-gradient(180deg,#ff7a86,#e0283c);box-shadow:0 12px 0 #8a0f1d,0 22px 40px rgba(0,0,0,.5);text-shadow:0 4px 0 #8a0f1d}
.vbtn:active{transform:translateY(8px)}
.verdict.on .vbtn{opacity:.28;filter:grayscale(.7)}
.verdict.on .vbtn.ans{opacity:1;filter:none;transform:scale(1.08);animation:winGlow 1.2s ease-in-out infinite}
.verdict.on .vbtn.ok.ans{box-shadow:0 12px 0 #0a6e38,0 0 0 8px #fff,0 0 70px 14px rgba(34,216,115,.9)}
.verdict.on .vbtn.no.ans{box-shadow:0 12px 0 #8a0f1d,0 0 0 8px #fff,0 0 70px 14px rgba(255,77,94,.9)}
@keyframes winGlow{50%{transform:scale(1.12)}}
.vbtn.shake{animation:shake .5s!important;opacity:1!important;filter:none!important;outline:8px solid var(--red)}
@keyframes shake{20%{transform:translateX(-22px)}40%{transform:translateX(20px)}60%{transform:translateX(-14px)}80%{transform:translateX(10px)}}

.fixbox{position:absolute;left:220px;width:1480px;top:818px;height:150px;border-radius:30px;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,#2c1460,#1a0a3d);box-shadow:inset 0 0 0 4px #5a32a8,0 18px 40px rgba(0,0,0,.55)}
.fixbox .cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:24px;font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:48px;color:#cdb8ff;transition:opacity .35s,transform .35s}
.fixbox .cover .q{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#5a32a8;color:#fff;font-size:50px}
.fixbox .body{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:26px;padding:0 40px;opacity:0;transform:translateY(30px);transition:all .5s cubic-bezier(.2,1.2,.4,1);white-space:nowrap}
.fixbox.on .cover{opacity:0;transform:translateY(-30px)}
.fixbox.on .body{opacity:1;transform:none}
.fixbox.on{background:linear-gradient(180deg,#fffdf5,#fff3d1);box-shadow:inset 0 0 0 5px var(--gold),0 0 50px rgba(255,201,60,.5),0 18px 40px rgba(0,0,0,.55)}
.chipw{font-size:56px;font-weight:800;padding:4px 24px;border-radius:16px}
.chipw.x{color:#c4122c;background:#ffe1e5;text-decoration:line-through;text-decoration-thickness:5px}
.chipw.v{color:#0a7a3c;background:#d6ffe6}
.pos{font-size:34px;font-weight:700;color:#5b2aa8;background:#efe5ff;border-radius:999px;padding:6px 20px;margin-left:8px;vertical-align:middle}
.arrow{font-size:60px;color:#7a5a00;font-weight:800}
.why{font-size:36px;font-weight:600;color:#2a1650;white-space:normal;line-height:1.2;max-width:640px}
.chipw span{font-weight:800}
.stamp{position:absolute;right:50px;top:648px;width:280px;width:300px;height:110px;display:grid;place-items:center;font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:58px;border-radius:22px;
  transform:rotate(9deg) scale(3);opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.stamp.good{color:#0a7a3c;background:#d6ffe6;border:8px solid #18b862;box-shadow:0 0 40px rgba(34,216,115,.7)}
.stamp.bad{color:#b0102a;background:#ffe1e5;border:8px solid #e0283c;box-shadow:0 0 40px rgba(255,77,94,.7)}
.slide:has(.verdict.on) .stamp{opacity:1;transform:rotate(9deg) scale(1)}
.panel.bump{animation:bump .5s}
@keyframes bump{30%{transform:translateX(-14px) rotate(-.6deg)}60%{transform:translateX(12px) rotate(.5deg)}}

/* countdown ring */
.cd{position:absolute;right:76px;top:28px;width:170px;height:170px;cursor:pointer}
.cd svg{width:170px;height:170px;transform:rotate(-90deg)}
.cd .trk{fill:#1a0a3d;stroke:#3b1d72;stroke-width:14}
.cd .arc{fill:none;stroke:var(--cyan);stroke-width:14;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--cyan));transition:stroke .3s}
.cd .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:62px;color:#fff}
.cd .sm{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:16px;font-weight:700;color:#bba6ff;letter-spacing:2px}
.cd.low .arc{stroke:var(--red);filter:drop-shadow(0 0 10px var(--red))}
.cd.low .lbl{color:#ff8a95;animation:pulse .5s infinite alternate}
.cd.done .lbl{font-size:30px;line-height:1.05;text-align:center;color:#fff;background:var(--red);border-radius:50%;margin:20px;animation:pulse .5s infinite alternate}
.cd.paused .sm::after{content:' ❚❚'}
.cd.done .sm{display:none}
#contents h4{position:sticky;top:-26px;background:#24104e;padding:10px 0;margin:-10px 0 6px;z-index:1}
.cd .rs{position:absolute;right:-12px;bottom:-6px;width:48px;height:48px;border-radius:50%;background:#3b1d72;border:3px solid #6a43c2;display:grid;place-items:center;font-size:28px;color:#fff;cursor:pointer}
@keyframes pulse{to{transform:scale(1.1)}}

/* ===== hall of fame table ===== */
.hof{position:absolute;left:180px;right:180px;top:180px;border-radius:26px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 6px var(--gold),0 0 60px rgba(255,201,60,.35)}
.hof table{width:100%;border-collapse:collapse;font-size:44px;color:#1b1b1b;table-layout:fixed}
.hof th{background:#7cc4cc;text-align:left;padding:14px 30px;font-weight:700;font-size:42px;color:#123}
.hof td{padding:0 30px;height:84px;border-top:3px solid #c8d8d8;border-left:3px solid #c8d8d8;background:#fff;position:relative}
.hof td:first-child{border-left:none}
.hof td.rv,.hof td.dash{background:#f0f7f4!important}
.hof td.gv{font-style:italic;font-weight:500}
.hof td.dash{color:#9aa;text-align:left}
.hof td.rv{cursor:pointer;color:#167a3a;font-weight:700}
.hof td.rv .a{opacity:0;display:inline-block;transform:scale(.6);transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.hof td.rv::before{content:'?';position:absolute;left:24px;top:50%;width:56px;height:56px;margin-top:-28px;border-radius:50%;background:#e2d6ff;color:#5b2aa8;font-weight:800;display:grid;place-items:center;font-size:36px;transition:all .3s}
.hof td.rv.on .a{opacity:1;transform:none}
.hof td.rv.on::before{opacity:0;transform:scale(0)}
.hof td.rv.on{background:#e3f7e9!important}

/* ===== bottom bar ===== */
#bar{position:absolute;left:0;right:0;bottom:0;height:90px;display:flex;align-items:center;gap:16px;padding:0 22px;
  background:linear-gradient(180deg,#1b0c3c,#0a0518);border-top:3px solid #ffc93c66;box-shadow:0 -10px 30px rgba(0,0,0,.6);z-index:20}
.bb{height:62px;min-width:62px;padding:0 24px;border-radius:16px;border:none;cursor:pointer;font-family:'Lexend';font-weight:700;font-size:26px;color:#fff;
  background:linear-gradient(180deg,#5a32a8,#3a1b78);box-shadow:0 5px 0 #20094a;display:flex;align-items:center;gap:10px;white-space:nowrap}
.bb:active{transform:translateY(4px);box-shadow:0 1px 0 #20094a}
.bb.gold{background:linear-gradient(180deg,#ffd970,#f2a81a);color:#2a1100;box-shadow:0 5px 0 #8a5300}
.bb.icon{padding:0;width:62px;justify-content:center}
.bb svg{width:38px;height:38px}
#ttl{flex:1;font-size:26px;font-weight:600;color:#cdb8ff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-left:8px}
#ctr{font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:30px;color:var(--gold);min-width:120px;text-align:center}
#pickName{font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:30px;color:#fff;padding:6px 18px;border-radius:14px;background:linear-gradient(180deg,#ff5fab,#d61f78);box-shadow:0 0 24px rgba(255,61,154,.8);cursor:pointer;display:none}
#pickName.show{display:block;animation:popIn .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes popIn{from{transform:scale(.3)}}
#swDisp{display:none;font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:36px;color:#7ff4ff;padding:4px 18px;border-radius:12px;background:#000;box-shadow:inset 0 0 0 2px #39e6ff88,0 0 22px rgba(57,230,255,.6);text-shadow:0 0 12px #39e6ff;cursor:pointer;min-width:150px;text-align:center}
#swDisp.show{display:block}
#swDisp.low{color:#ff8a95;text-shadow:0 0 12px #ff4d5e;box-shadow:inset 0 0 0 2px #ff4d5e,0 0 22px rgba(255,77,94,.7);animation:pulse .5s infinite alternate}
#swDisp.up{background:var(--red);color:#fff;font-size:30px}
#swDisp.flash{animation:flash .3s steps(2) infinite}
@keyframes flash{50%{opacity:.2}}

/* popovers */
.pop{position:absolute;z-index:40;background:linear-gradient(180deg,#24104e,#130830);border-radius:24px;box-shadow:0 0 0 3px #6a43c2,0 30px 70px rgba(0,0,0,.7);padding:26px;display:none}
.pop.show{display:block;animation:popUp .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes popUp{from{opacity:0;transform:translateY(30px) scale(.9)}}
.pop h4{font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:30px;color:var(--gold);margin-bottom:16px}
#swMenu{left:110px;bottom:110px;width:520px}
#swMenu .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
#swMenu button{height:74px;border:none;border-radius:16px;font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:32px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#3b8ee6,#1b5cb0);box-shadow:0 5px 0 #0d3570}
#contents{left:20px;bottom:110px;width:760px;max-height:820px;overflow-y:auto}
#contents .it{display:flex;gap:18px;align-items:center;padding:12px 18px;border-radius:14px;font-size:27px;cursor:pointer;color:#eadfff}
#contents .it:hover{background:#3a1b78}
#contents .it.cur{background:linear-gradient(90deg,#ffc93c,#f2a81a);color:#2a1100;font-weight:700}
#contents .it .k{font-family:'Bungee','Arial Black',Impact,sans-serif;width:50px;text-align:right;opacity:.8}
#roster{left:20px;bottom:110px;width:560px;text-align:center}
#roster .cls{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:24px;color:#cdb8ff}
#roster .cls a{color:#7ff4ff;cursor:pointer;text-decoration:underline}
#reel{height:300px;border-radius:20px;background:#07031a;position:relative;overflow:hidden;box-shadow:inset 0 0 0 3px #3b1d72}
#reel::before,#reel::after{content:'';position:absolute;left:0;right:0;height:100px;z-index:2;pointer-events:none}
#reel::before{top:0;background:linear-gradient(#07031a,transparent)}
#reel::after{bottom:0;background:linear-gradient(transparent,#07031a)}
#reel .win{position:absolute;left:14px;right:14px;top:105px;height:90px;border-radius:16px;border:4px solid var(--gold);box-shadow:0 0 30px rgba(255,201,60,.6);z-index:3;pointer-events:none}
#reelList{position:absolute;left:0;right:0;top:0}
#reelList div{height:90px;line-height:90px;font-family:'Bungee','Arial Black',Impact,sans-serif;font-size:48px;color:#fff}

<script>

 {pre:'To study abroad, you need', w:'proficiency', post:'in English.', ok:true, p:'noun', why:'<b>need</b> + a thing (noun).'},
 {pre:'The new lift helps students with a', w:'disabled', post:'get to class.', ok:false, p:'adjective', f:'disability', fp:'noun', why:'After <b>a</b> with nothing after it, we need a noun.'},

// Hall of fame table: [text, given?]  ('-' = no form)
const TABLE = [
 [['rapid',1],['-'],['rapidly',0],['-']],

/* ================= ICONS ================= */
const STAR_SVG = (id)=>`<svg viewBox="0 0 100 100"><defs><radialGradient id="${id}" cx="40%" cy="35%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#ffc93c"/><stop offset="1" stop-color="#d98a00"/></radialGradient></defs><path d="M50 4l13.5 29 31.5 3.6-23.5 21.6 6.6 31.2L50 73.6 21.9 89.4l6.6-31.2L5 36.6l31.5-3.6z" fill="url(#${id})" stroke="#fff3c4" stroke-width="3" stroke-linejoin="round"/></svg>`;

      <h3>Fix it</h3><p>Wrong? Say the <b>correct form</b> and its part of speech.</p></div>

ITEMS.forEach((it,i)=>{
  const n=i+1, nn=String(n).padStart(2,'0');

  const star = `<span class="starw ${it.ok?'good':'bad'}"><span class="mini">${STAR_SVG('sw'+n)}</span><span class="orig">${it.w}</span>${it.ok?'<span class="tick"> ✓</span>':`<span class="fixw">${it.f}</span>`}</span>`;

  const body = it.ok
    ? `<span class="chipw v">${it.w}<span class="pos">${it.p}</span></span><span class="arrow">✓</span><span class="why">${it.why}</span>`
    : `<span class="chipw x">${it.w}</span><span class="arrow">→</span><span class="chipw v">${it.f}<span class="pos">${it.fp}</span></span><span class="why">${it.why}</span>`;
  addSlide(`
    <div class="plate rise"><div><div class="lab">CONTESTANT</div><div style="display:flex;align-items:baseline;gap:10px"><div class="num">${nn}</div><div class="of">/ ${ITEMS.length}</div></div></div></div>
    <div class="qline rise">Is the <span class="g">★ star word</span> the right part of speech?</div>
    <div class="cd"><svg viewBox="0 0 170 170"><circle class="trk" cx="85" cy="85" r="70"/><circle class="arc" cx="85" cy="85" r="70"/></svg><div class="lbl">15</div><div class="sm">SEC</div><div class="rs" title="Restart">↺</div></div>
    <div class="marquee panel rise" style="animation-delay:.1s"><div class="sent"><div>${sentence}</div></div></div>
    <div class="stamp ${it.ok?'good':'bad'}">${it.ok?'STAR!':'BUZZ!'}</div>
    <div class="verdict rv" data-kind="verdict">
      <button class="vbtn ok ${it.ok?'ans':''}" data-v="ok">${TICK}RIGHT</button>
      <button class="vbtn no ${it.ok?'':'ans'}" data-v="no">${CROSS}WRONG</button>
    </div>
    <div class="fixbox rv" data-kind="fix"><div class="cover"><span class="q">?</span>${it.ok?'Why is it right?':'Fix it! Which form?'}</div><div class="body">${body}</div></div>
  `,`Contestant ${n}: ${it.pre?'…':''}${it.w}…`,{rev:true,type:'q',item:it,notes:[

         :`Answer: WRONG – “${it.w}” is a ${it.p}. Correct form: “${it.f}” (${it.fp}). ${it.why.replace(/<[^>]+>/g,'')}`,

});

{
  let rows = TABLE.map(r=>'<tr>'+r.map(c=>{

  addSlide(`

}

/* ================= MARQUEE BULBS ================= */
function bulbs(el,step=46,inset=0){
  const w=el.offsetWidth,h=el.offsetHeight,r=36;
  const per=2*(w+h); const n=Math.round(per/step);
  for(let i=0;i<n;i++){
    let d=i*per/n,x,y;
    if(d<w){x=d;y=0}else if(d<w+h){x=w;y=d-w}else if(d<2*w+h){x=w-(d-w-h);y=h}else{x=0;y=h-(d-2*w-h)}
    // pull corners inward a little to follow radius
    const cx=Math.min(Math.max(x,r),w-r), cy=Math.min(Math.max(y,r),h-r);
    if((x<r||x>w-r)&&(y<r||y>h-r)){const a=Math.atan2(y-cy,x-cx);x=cx+Math.cos(a)*r;y=cy+Math.sin(a)*r;}
    const b=document.createElement('div');b.className='bulb d'+(i%3);b.style.left=(x+inset)+'px';b.style.top=(y+inset)+'px';el.appendChild(b);
  }
}
document.querySelectorAll('.marquee').forEach(m=>{m.style.position='absolute'});
// need layout: slides are absolute & sized, offsetWidth works even at opacity 0
document.querySelectorAll('.marquee').forEach(m=>bulbs(m));

/* ================= AUDIO ================= */
let AC=null;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,dur,type='sine',g=.2,f2=null,dest=null){const a=ac(),o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+dur);gn.gain.setValueAtTime(0.0001,a.currentTime+t0);gn.gain.exponentialRampToValueAtTime(g,a.currentTime+t0+.01);gn.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);o.connect(gn);gn.connect(dest||a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05)}
function noise(t0,dur,g=.2,ftype='highpass',ff=2000){const a=ac(),b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=ftype;f.frequency.value=ff;const gn=a.createGain();gn.gain.setValueAtTime(g,a.currentTime+t0);gn.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);s.connect(f);f.connect(gn);gn.connect(a.destination);s.start(a.currentTime+t0)}
const SOUNDS={
 alarm(){for(let i=0;i<12;i++)tone(2000,i*.25,.12,'square',.12)},
 buzzer(){tone(110,0,1.4,'sawtooth',.3);tone(116,0,1.4,'sawtooth',.25)},
 boxing(){for(let i=0;i<3;i++){tone(820,i*.9,.9,'sine',.35);tone(2140,i*.9,.6,'sine',.12)}},
 jingle(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.14,.16,'square',.12))},
 gong(){tone(98,0,3,'sine',.45);tone(147,0,2.6,'sine',.2);tone(233,0,2.2,'sine',.12);noise(0,.4,.12,'lowpass',800)},
 school(){const a=ac(),o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();o.frequency.value=1100;l.frequency.value=22;lg.gain.value=.15;l.connect(lg);lg.connect(g.gain);g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();l.start();o.stop(a.currentTime+2.6);l.stop(a.currentTime+2.6)},
 fanfare(){[[392,0],[523,.18],[659,.36],[784,.54],[659,.8],[784,1]].forEach(([f,t])=>{tone(f,t,.3,'square',.12);tone(f/2,t,.3,'triangle',.12)})},
 spaceship(){for(let i=0;i<4;i++){tone(400,i*.6,.3,'sine',.25,1200);tone(1200,i*.6+.3,.3,'sine',.25,400)}},
 xylo(){[523,587,659,698,784,880,988,1047,1175,1319].forEach((f,i)=>tone(f,i*.1,.5,'triangle',.25))},
 airhorn(){[0,.7].forEach(t=>{tone(233,t,.55,'sawtooth',.25);tone(294,t,.55,'sawtooth',.2);tone(349,t,.55,'sawtooth',.15)})},
 cuckoo(){for(let i=0;i<3;i++){tone(659,i*.8,.25,'sine',.3);tone(523,i*.8+.3,.35,'sine',.3)}},
 drum(){for(let i=0;i<28;i++)noise(i*.06,.05,.15,'bandpass',300);noise(1.8,1.2,.3,'highpass',5000)},
 train(){[0,.9].forEach(t=>{[440,554,659].forEach(f=>tone(f,t,.75,'sine',.13))})},
 doorbell(){tone(659,0,1,'sine',.35);tone(523,.6,1.4,'sine',.35)},
 laser(){for(let i=0;i<7;i++)tone(1800,i*.2,.18,'square',.1,200)},
 chimes(){for(let i=0;i<14;i++)tone(1400+Math.random()*1800,i*.18+Math.random()*.08,.9,'sine',.12)},
 trombone(){[[294,0,.4],[277,.45,.4],[262,.9,.4],[247,1.35,1.2]].forEach(([f,t,d])=>tone(f,t,d,'sawtooth',.18))}
};

/* ================= BACKGROUND CANVAS ================= */

{const c=crowd.getContext('2d');const g=c.createLinearGradient(0,0,0,240);g.addColorStop(0,'#1a0a35');g.addColorStop(1,'#05020c');c.fillStyle=g;

const motes=[...Array(70)].map(()=>({x:Math.random()*1920,y:Math.random()*900,v:.1+Math.random()*.3,r:1+Math.random()*2.2}));
let conf=[];
function burst(x=960,y=420,n=160){const cols=['#ffc93c','#ff3d9a','#39e6ff','#22d873','#fff','#a46bff'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=6+Math.random()*16;conf.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-8,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],w:10+Math.random()*10,h:6+Math.random()*8,life:160+Math.random()*60})}}
let T=0;
function drawBG(){
  T+=1/60;const c=cx;
  const g=c.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#160733');g.addColorStop(.55,'#2b0b52');g.addColorStop(1,'#0c0420');c.fillStyle=g;c.fillRect(0,0,1920,1080);
  // LED wall columns
  for(let i=0;i<24;i++){const x=i*80+10;const v=.5+.5*Math.sin(T*1.3+i*.55);const hue=(280+i*6+T*20)%360;
    const lg=c.createLinearGradient(0,60,0,700);lg.addColorStop(0,`hsla(${hue},90%,60%,${.05+.12*v})`);lg.addColorStop(1,'hsla(280,90%,40%,0)');
    c.fillStyle=lg;c.fillRect(x,40,56,680);
    for(let k=0;k<11;k++){c.fillStyle=`hsla(${hue},100%,${70}%,${.08+.25*v*(k%2?1:.6)})`;c.fillRect(x+22,70+k*58,12,12)}}
  // spotlights
  c.save();c.globalCompositeOperation='lighter';
  const spots=[{x:260,h:'255,61,154',a:Math.sin(T*.5)*.35+.25},{x:960,h:'255,215,120',a:Math.sin(T*.4+1)*.25},{x:1660,h:'57,230,255',a:Math.sin(T*.55+2)*.35-.25}];
  spots.forEach(s=>{c.save();c.translate(s.x,-20);c.rotate(s.a);const len=1200,w=300;
    const lg=c.createLinearGradient(0,0,0,len);lg.addColorStop(0,`rgba(${s.h},.45)`);lg.addColorStop(1,`rgba(${s.h},0)`);
    c.fillStyle=lg;c.beginPath();c.moveTo(-18,0);c.lineTo(18,0);c.lineTo(w,len);c.lineTo(-w,len);c.closePath();c.fill();
    c.fillStyle=`rgba(${s.h},.9)`;c.beginPath();c.arc(0,4,22,0,6.28);c.fill();c.restore();});
  // floor glow
  const fg=c.createRadialGradient(960,930,50,960,930,900);fg.addColorStop(0,'rgba(255,170,60,.35)');fg.addColorStop(1,'rgba(255,170,60,0)');c.fillStyle=fg;c.fillRect(0,700,1920,380);
  // motes
  motes.forEach(m=>{m.y-=m.v;if(m.y<0)m.y=900;c.fillStyle=`rgba(255,240,200,${.25+.25*Math.sin(T*2+m.x)})`;c.beginPath();c.arc(m.x,m.y,m.r,0,6.28);c.fill()});
  c.restore();
  // crowd + phones
  c.drawImage(crowd,0,850);
  c.save();c.globalCompositeOperation='lighter';phones.forEach(p=>{const v=.5+.5*Math.sin(T*2+p.p);const rg=c.createRadialGradient(p.x,p.y,0,p.x,p.y,26*p.s);rg.addColorStop(0,`rgba(255,255,240,${.9*v})`);rg.addColorStop(1,'rgba(255,255,240,0)');c.fillStyle=rg;c.beginPath();c.arc(p.x,p.y,26*p.s,0,6.28);c.fill()});c.restore();
  // confetti
  conf=conf.filter(p=>p.life-->0&&p.y<1100);conf.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));c.restore()});
}
let running=false;
function loop(){if(running)drawBG();requestAnimationFrame(loop)}
drawBG();requestAnimationFrame(loop);

/* ================= NAVIGATION ================= */
let cur=0;
const ctr=document.getElementById('ctr'),ttl=document.getElementById('ttl'),bReveal=document.getElementById('bReveal');
function rvs(i=cur){return [...SL[i].el.querySelectorAll('.rv')]}
function updRevealBtn(){const r=rvs();bReveal.style.visibility=r.length?'visible':'hidden';bReveal.textContent=r.length&&r.every(e=>e.classList.contains('on'))?'Hide all':'Reveal all'}
function go(i){
  if(i<0||i>=SL.length)return;
  SL[cur].el.classList.remove('active');cur=i;conf=[];const s=SL[cur];s.el.classList.add('active');
  // restart rise animations
  s.el.querySelectorAll('.rise').forEach(e=>{e.style.animation='none';e.offsetWidth;e.style.animation=''});
  ctr.textContent=`${cur+1} / ${SL.length}`;ttl.textContent=s.title;
  updRevealBtn();closePops();clearPick();swClear();
  stopAllCD();
  if(s.type==='q'&&!rvs().some(e=>e.classList.contains('on')))startCD(s.el);
  // step loop on info slide
  clearInterval(stepLoop);if(s.el.querySelector('.step'))runSteps(s.el);
}
function show(el){if(el.classList.contains('on'))return;el.classList.add('on');
  const s=SL[cur];
  if(el.dataset.kind==='verdict'){stopCD(s.el,true);if(s.item.ok)burst(960,420);else s.el.querySelector('.panel').classList.remove('bump'),void s.el.offsetWidth,s.el.querySelector('.panel').classList.add('bump');}
  if(el.dataset.kind==='fix'&&!el.previousElementSibling.classList.contains('on'))show(el.previousElementSibling);
  updRevealBtn()}
function hide(el){el.classList.remove('on');el.querySelectorAll('.shake').forEach(b=>b.classList.remove('shake'));
  if(el.dataset.kind==='verdict'){const f=el.nextElementSibling;if(f&&f.classList.contains('on'))f.classList.remove('on')}
  updRevealBtn()}
function revNext(){const r=rvs();const n=r.find(e=>!e.classList.contains('on'));if(n)show(n);else go(cur+1)}
function revPrev(){const r=rvs().filter(e=>e.classList.contains('on'));if(r.length)hide(r[r.length-1]);else go(cur-1)}

document.getElementById('bNext').onclick=()=>go(cur+1);
document.getElementById('bBack').onclick=()=>go(cur-1);
bReveal.onclick=()=>{const r=rvs();if(r.every(e=>e.classList.contains('on')))r.slice().reverse().forEach(hide);else r.forEach(show)};

// slide clicks
slidesEl.addEventListener('click',e=>{
  if(document.body.classList.contains('frozen'))return;
  const s=SL[cur];
  const vb=e.target.closest('.vbtn');
  if(vb){const v=vb.parentElement;if(v.classList.contains('on')){hide(v);return}show(v);if(!vb.classList.contains('ans')){vb.classList.add('shake')}return}
  const fx=e.target.closest('.fixbox');if(fx){fx.classList.contains('on')?hide(fx):show(fx);return}
  const td=e.target.closest('td.rv');if(td){td.classList.contains('on')?hide(td):show(td);return}
  if(e.target.closest('.cd'))return;
  if(s.rev)revNext();
});

/* ================= ROUND COUNTDOWN ================= */
const CDLEN=15;const CIRC=2*Math.PI*70;
function cdEl(el){return el.querySelector('.cd')}
function setCD(c,t){const arc=c.querySelector('.arc');arc.style.strokeDasharray=CIRC;arc.style.strokeDashoffset=CIRC*(1-t/CDLEN);
  const l=c.querySelector('.lbl');c.classList.toggle('low',t<=5&&t>0);
  if(t<=0){c.classList.add('done');l.innerHTML="TIME'S<br>UP";}else{c.classList.remove('done');l.textContent=Math.ceil(t)}}
function startCD(el){const c=cdEl(el);if(!c)return;c._t=CDLEN;c._run=true;c.classList.remove('paused');setCD(c,CDLEN);c._last=performance.now();cdTick(c)}
function cdTick(c){clearTimeout(c._to);if(!c._run)return;const now=performance.now();c._t-= (now-c._last)/1000;c._last=now;
  if(c._t<=0){c._t=0;c._run=false;setCD(c,0);return}setCD(c,c._t);c._to=setTimeout(()=>cdTick(c),100)}
function stopCD(el,freeze){const c=cdEl(el);if(!c)return;c._run=false;clearTimeout(c._to);if(freeze)c.classList.add('paused')}
function stopAllCD(){SL.forEach(s=>{const c=cdEl(s.el);if(c){c._run=false;clearTimeout(c._to)}})}
document.querySelectorAll('.cd').forEach(c=>{
  setCD(c,CDLEN);
  c.addEventListener('click',e=>{e.stopPropagation();
    if(e.target.closest('.rs')){c._t=CDLEN;c._run=true;c.classList.remove('paused');c._last=performance.now();setCD(c,CDLEN);cdTick(c);return}
    if(c._t<=0){return}
    if(c._run){c._run=false;c.classList.add('paused')}else{c._run=true;c.classList.remove('paused');c._last=performance.now();cdTick(c)}});
});

/* ================= INFO STEP LOOP ================= */
let stepLoop=null;
function runSteps(el){const st=[...el.querySelectorAll('.step')];let k=0;const f=()=>{st.forEach((s,i)=>s.classList.toggle('lit',i===k));k=(k+1)%st.length};setTimeout(f,900);stepLoop=setInterval(f,2200)}

/* ================= POPOVERS ================= */
const pops=['contents','swMenu','roster','notes'].map(id=>document.getElementById(id));
function closePops(except){pops.forEach(p=>{if(p!==except)p.classList.remove('show')})}
function togglePop(p){const on=!p.classList.contains('show');closePops();if(on)p.classList.add('show');return on}
document.getElementById('bContents').onclick=e=>{e.stopPropagation();const p=document.getElementById('contents');
  if(togglePop(p)){const l=document.getElementById('clist');l.innerHTML=SL.map((s,i)=>`<div class="it ${i===cur?'cur':''}" data-i="${i}"><span class="k">${i+1}</span>${s.title}</div>`).join('');
    l.querySelectorAll('.it').forEach(d=>d.onclick=()=>{go(+d.dataset.i)});const c=l.querySelector('.cur');p.scrollTop=c.offsetTop-300}};
document.getElementById('bNotes').onclick=e=>{e.stopPropagation();const p=document.getElementById('notes');if(togglePop(p))document.getElementById('nlist').innerHTML=SL[cur].notes.map(n=>`<li>${n}</li>`).join('')};
stage.addEventListener('click',e=>{if(!e.target.closest('.pop')&&!e.target.closest('#bar'))closePops()});

/* ================= STOPWATCH ================= */
const swDisp=document.getElementById('swDisp');let sw={total:0,left:0,run:false,to:null,done:false};
const SWT=[1,2,3,4,5,7.5,10,12,15];
document.querySelector('#swMenu .grid').innerHTML=SWT.map(m=>`<button data-m="${m}">${m}</button>`).join('');
document.querySelectorAll('#swMenu button').forEach(b=>b.onclick=()=>{swSet(+b.dataset.m*60);closePops()});
document.getElementById('bSW').onclick=e=>{e.stopPropagation();togglePop(document.getElementById('swMenu'))};
function fmt(s){s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function swSet(sec){swClear();sw.total=sw.left=sec;swDisp.textContent=fmt(sec);swDisp.className='show'}
function swTick(){if(!sw.run)return;const now=performance.now();sw.left-=(now-sw.last)/1000;sw.last=now;
  if(sw.left<=0){sw.left=0;sw.run=false;sw.done=true;swDisp.textContent="TIME'S UP";swDisp.className='show up flash';randomSound();setTimeout(()=>{if(sw.done)swDisp.classList.remove('flash')},3000);return}
  swDisp.textContent=fmt(sw.left);swDisp.classList.toggle('low',sw.left<=sw.total*.1);sw.to=setTimeout(swTick,100)}
swDisp.onclick=e=>{e.stopPropagation();if(sw.done){swClear();return}if(sw.run){sw.run=false;clearTimeout(sw.to)}else{sw.run=true;sw.last=performance.now();swTick()}};
function swClear(){sw.run=false;sw.done=false;clearTimeout(sw.to);swDisp.className='';swDisp.textContent=''}

/* ================= ROSTER PICKER ================= */
let rClass=null;try{const c=localStorage.getItem('rosterClass');if(c&&ROSTERS[c])rClass=c}catch(e){}
const picked={};const rPop=document.getElementById('roster'),reelList=document.getElementById('reelList'),pickName=document.getElementById('pickName');
const classesWithNames=Object.keys(ROSTERS).filter(k=>ROSTERS[k].length);
if(!rClass&&classesWithNames.length===1)rClass=classesWithNames[0];
function chooseClass(){const cp=document.getElementById('classPick');cp.style.display='flex';document.getElementById('reel').style.display='none';
  cp.innerHTML=classesWithNames.map(k=>`<button>${k}</button>`).join('');cp.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();rClass=b.textContent;try{localStorage.setItem('rosterClass',rClass)}catch(x){}cp.style.display='none';document.getElementById('reel').style.display='block';doPick()})}
document.getElementById('rChange').onclick=e=>{e.stopPropagation();chooseClass()};
function openRoster(){closePops();rPop.classList.add('show');clearPick();
  if(!rClass){document.getElementById('rClass').textContent='Choose a class';chooseClass();return}
  document.getElementById('classPick').style.display='none';document.getElementById('reel').style.display='block';doPick()}
let picking=false;
function doPick(){if(picking)return;picking=true;document.getElementById('rClass').textContent='Class '+rClass;
  const all=ROSTERS[rClass];picked[rClass]=picked[rClass]||[];let pool=all.filter(n=>!picked[rClass].includes(n));if(!pool.length){picked[rClass]=[];pool=all.slice()}
  const winner=pool[Math.floor(Math.random()*pool.length)];picked[rClass].push(winner);
  const seq=[];for(let i=0;i<22;i++)seq.push(all[Math.floor(Math.random()*all.length)]);seq.push(winner);
  reelList.innerHTML=['',...seq,''].map(n=>`<div>${n}</div>`).join('');
  let i=0;const total=seq.length;const t0=performance.now();
  function stepR(){const p=i/(total-1);reelList.style.transform=`translateY(${-(i)*90+15}px)`;tick();
    if(i>=total-1){const f=reelList.children[i+1];f.classList.add('final');picking=false;
      setTimeout(()=>{rPop.classList.remove('show');pickName.textContent=winner;pickName.classList.add('show')},1300);return}
    i++;const delay=30+Math.pow(p,3)*260;setTimeout(stepR,delay)}
  reelList.style.transition='transform .08s';stepR()}
document.getElementById('bRoster').onclick=e=>{e.stopPropagation();openRoster()};
pickName.onclick=e=>{e.stopPropagation();openRoster()};
function clearPick(){pickName.classList.remove('show')}

/* ================= B / W / KEYS ================= */
const blk=document.getElementById('blk'),wht=document.getElementById('wht');let shh=null;
function shhStart(){try{const a=ac();const len=a.sampleRate*2,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=b;src.loop=true;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=3200;f.Q.value=.8;const g=a.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(a.destination);src.start();
  const pulse=()=>{const t=a.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.25);g.gain.setValueAtTime(.35,t+1.1);g.gain.linearRampToValueAtTime(0,t+1.6)};
  pulse();const iv=setInterval(pulse,2600);shh={src,iv}}catch(e){}}
function shhStop(){if(shh){clearInterval(shh.iv);try{shh.src.stop()}catch(e){}shh=null}}
function setB(on){blk.classList.toggle('show',on);if(on){wht.classList.remove('show');shhStart()}else shhStop()}
function setW(on){wht.classList.toggle('show',on);if(on){blk.classList.remove('show');shhStop()}}

const still=document.getElementById('still');
function wake(){if(!document.body.classList.contains('frozen'))return;document.body.classList.remove('frozen');still.classList.remove('show');running=true;
  // replay title entrance
  SL[0].el.querySelectorAll('.bigword').forEach(e=>{e.style.animation='none';e.offsetWidth;e.style.animation=''})}
still.addEventListener('click',e=>{e.stopPropagation();wake()});

addEventListener('keydown',e=>{
  if(document.body.classList.contains('frozen')){wake();e.preventDefault();return}
  const k=e.key;
  if(k==='b'||k==='B'){setB(!blk.classList.contains('show'));return}
  if(k==='w'||k==='W'){setW(!wht.classList.contains('show'));return}
  if(k==='Escape'){setB(false);setW(false);closePops();return}
  if(blk.classList.contains('show')||wht.classList.contains('show'))return;
  const rev=SL[cur].rev;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();rev?revNext():go(cur+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();rev?revPrev():go(cur-1)}
});

/* ================= START ================= */
SL[0].el.classList.add('active');ctr.textContent=`1 / ${SL.length}`;ttl.textContent=SL[0].title;updRevealBtn();
still.classList.add('show');
</script>
