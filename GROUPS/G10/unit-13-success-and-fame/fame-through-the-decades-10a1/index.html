<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fame Through the Decades – Celebrity Draw (10A1)</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Oswald:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#f2c14e;--cream:#fff6e3;--panel:#130e0b;--card:#1d1512;
    --display:'Limelight',Georgia,serif;--cond:'Oswald','Arial Narrow','Roboto Condensed',sans-serif;--body:'Atkinson Hyperlegible',Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#080605;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
    font-family:var(--body);color:var(--cream);user-select:none;-webkit-user-select:none}
  #bg{position:absolute;left:0;top:0;width:1920px;height:1080px}

  /* Header */
  .plate{position:absolute;left:40px;top:24px;padding:12px 34px 16px;background:var(--panel);border:2px solid #5d4428;border-radius:18px;
    box-shadow:0 10px 28px rgba(0,0,0,.6)}
  .kicker{font:700 20px var(--body);letter-spacing:.34em;color:var(--gold)}
  h1{font:400 58px/1.05 var(--display);color:var(--cream);margin-top:4px;letter-spacing:.01em}
  .pill{position:absolute;right:40px;top:50px;padding:10px 30px;border-radius:999px;background:var(--gold);color:#1a1205;
    font:700 30px var(--cond);letter-spacing:.04em;border:3px solid #fff1c7;box-shadow:0 8px 22px rgba(0,0,0,.55)}

  /* Student cards */
  #students{position:absolute;left:40px;top:166px;width:1230px;height:794px;display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:14px 16px}
  .card{position:relative;min-width:0;background:var(--card);border:2px solid #3f2f23;border-radius:16px;display:flex;align-items:center;gap:14px;
    padding:0 16px 0 14px;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s,border-color .2s}
  .ready .card{cursor:pointer}
  .badge{flex:0 0 62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#f2c14e 55%,#b5832a);
    color:#1a1205;font:700 32px var(--cond);display:flex;align-items:center;justify-content:center;border:3px solid #fff1c7}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .top{display:flex;align-items:baseline;gap:10px;height:36px}
  .sname{flex:1;min-width:0;font:600 32px/36px var(--cond);color:#fff;white-space:nowrap;overflow:hidden;letter-spacing:.02em}
  .era{flex:0 0 auto;font:700 15px var(--body);letter-spacing:.06em;white-space:nowrap}
  .frame{position:relative;height:56px;border-radius:6px;background:#070505;padding:7px 0;overflow:hidden}
  .frame::before,.frame::after{content:'';position:absolute;left:0;right:0;height:4px;
    background:repeating-linear-gradient(90deg,rgba(255,238,205,.6) 0 8px,transparent 8px 16px)}
  .frame::before{top:1.5px}.frame::after{bottom:1.5px}
  .frame.spinning::before,.frame.spinning::after{animation:sprocket .25s linear infinite}
  @keyframes sprocket{to{background-position:16px 0}}
  .win{position:relative;height:42px;overflow:hidden;border-radius:3px}
  .win.hide>*{visibility:hidden}
  .reel{position:absolute;left:0;right:0;top:0;will-change:transform}
  .ri{display:block;height:42px;line-height:42px;padding:0 12px;border-left:6px solid;font:600 29px var(--cond);color:#fff;
    white-space:nowrap;overflow:hidden;letter-spacing:.02em}
  .ri.ph{background:#2a201a;border-color:#6d5a47;color:#c9bba6;letter-spacing:.4em}
  .card.sel{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 0 0 4px rgba(242,193,78,.55),0 0 36px rgba(242,193,78,.65)}
  .picking .card:not(.sel):hover{border-color:#fff6e3}
  .card.pop .win{animation:landFlash .7s ease-out}
  @keyframes landFlash{0%{transform:scale(1.07);filter:brightness(1.7)}100%{transform:scale(1);filter:none}}
  .card.incoming .era{visibility:hidden}

  /* Archive */
  #archive{position:absolute;left:1296px;top:166px;width:584px;height:794px;background:var(--panel);border:2px solid #5d4428;border-radius:16px;
    padding:10px 12px 12px;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(0,0,0,.6)}
  .ahead{display:flex;align-items:baseline;justify-content:space-between;height:32px;padding:0 4px}
  .ahead .t{font:400 24px var(--display);color:var(--gold)}
  .ahead .h{font:700 15px var(--body);color:#e9dcc6;letter-spacing:.06em}
  #eras{flex:1;display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .eblock{flex:1;background:#1c1411;border:1px solid #3d2e22;border-left:6px solid;border-radius:10px;padding:6px 10px 8px;display:flex;flex-direction:column}
  .ehead{display:flex;align-items:center;justify-content:space-between;gap:10px;height:24px}
  .et{flex:1;min-width:0;font:400 16px var(--body);color:#efe4d2;white-space:nowrap;overflow:hidden}
  .et b{font-weight:700}
  .ecount{flex:0 0 auto;font:700 15px var(--body);color:#fff6e3;background:#2f241c;border-radius:999px;padding:1px 10px}
  .chips{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:6px;margin-top:6px}
  .chip{min-width:0;min-height:0;border-radius:7px;border:2px solid;display:flex;flex-direction:column;justify-content:center;padding:0 9px;overflow:hidden;
    transition:background .3s,border-color .3s}
  .chip .n{font:600 20px/22px var(--cond);color:#fff;white-space:nowrap;overflow:hidden;letter-spacing:.02em}
  .chip .o{font:700 13px/15px var(--body);white-space:nowrap;overflow:hidden;display:none}
  .chip.taken{background:#110c0a!important;border-color:#3b2e25!important}
  .chip.taken .n{color:#ab9d8a}
  .chip.taken .o{display:block}
  .chip.hide .n,.chip.hide .o{visibility:hidden}
  .ready .chip{cursor:pointer}
  .picking .chip:not(.taken){animation:chipGlow 1.4s ease-in-out infinite}
  @keyframes chipGlow{50%{box-shadow:0 0 0 2px #fff6e3,0 0 18px var(--ec)}}
  .chip.pulse{animation:chipPulse .8s ease-out!important}
  @keyframes chipPulse{0%{transform:scale(1.12);box-shadow:0 0 26px var(--ec)}100%{transform:scale(1)}}

  /* Bottom bar */
  #bar{position:absolute;left:40px;right:40px;top:978px;height:80px;display:flex;align-items:center;justify-content:center;gap:22px}
  #hint{background:var(--panel);border:2px solid #5d4428;border-radius:999px;padding:12px 28px;font:400 22px var(--body);color:var(--cream);
    max-width:1180px;white-space:nowrap;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.55)}
  #hint b{color:var(--gold)}
  .btn{display:inline-flex;align-items:center;gap:12px;font:600 30px var(--cond);letter-spacing:.06em;padding:10px 34px;border-radius:999px;border:3px solid #fff1c7;
    background:linear-gradient(#ffd977,#e6a42a);color:#1a1205;cursor:pointer;box-shadow:0 6px 0 #8a5a12,0 12px 26px rgba(0,0,0,.55);transition:transform .12s,opacity .2s}
  .btn:hover:not(:disabled){transform:translateY(-2px)}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #8a5a12,0 8px 18px rgba(0,0,0,.55)}
  .btn.ghost{background:#1d1512;color:var(--cream);border-color:#7a5c3c;box-shadow:0 6px 0 #0a0706,0 12px 26px rgba(0,0,0,.55)}
  .btn.warn{background:#7d1d1d;border-color:#ffb3a8;color:#fff}
  .btn:disabled{background:#3a2f26;color:#a39582;border-color:#5d4428;box-shadow:0 6px 0 #0a0706;cursor:default}
  .btn[hidden]{display:none}
  .btn svg{width:30px;height:30px}

  #fly{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:50}
  .flyer{position:absolute;left:0;top:0;display:flex;align-items:center;padding:0 12px;border:2px solid;border-left-width:6px;border-radius:6px;
    font:600 26px var(--cond);color:#fff;white-space:nowrap;overflow:hidden;letter-spacing:.02em;transform-origin:center}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div class="plate"><div class="kicker">◆ Celebrity Draw ◆</div><h1>Fame Through the Decades</h1></div>
  <div class="pill" id="pill"></div>
  <div id="students"></div>
  <section id="archive">
    <div class="ahead"><span class="t">The Archive</span><span class="h">BRIGHT = STILL AVAILABLE</span></div>
    <div id="eras"></div>
  </section>
  <div id="bar">
    <div id="hint"></div>
    <button class="btn" id="drawBtn">Draw Celebrities</button>
    <button class="btn" id="randBtn" hidden><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="3" width="24" height="24" rx="6" fill="#fff6e3" stroke="#1a1205" stroke-width="2.5"/><circle cx="10" cy="10" r="2.6" fill="#1a1205"/><circle cx="20" cy="20" r="2.6" fill="#1a1205"/><circle cx="15" cy="15" r="2.6" fill="#1a1205"/><circle cx="20" cy="10" r="2.6" fill="#1a1205"/><circle cx="10" cy="20" r="2.6" fill="#1a1205"/></svg>Random Swap</button>
    <button class="btn ghost" id="redrawBtn" hidden>Draw Again</button>
  </div>
  <div id="fly"></div>
</div>

<script>
/* ===== Edit here: class and students ===== */
var CLASS_NAME = '10A1';
var STUDENTS = ['Aavni','Andy','Ashley','Bob','Camry','Felicia','Henry','Izza','Jena','Jeremy','Katie','Kevin','Lam','Melissa','Nicky','Sam','Tony'];

/* ===== Celebrity list by era ===== */
var ERAS = [
  {n:1, name:'Pre-mass-media', years:'up to 1920s', short:'to 1920s', c:'#e0b673', b:'#3c2a15',
   celebs:['Florence Nightingale','Harry Houdini','Marie Curie','Mary Pickford','Charlie Chaplin','Mark Twain']},
  {n:2, name:'Golden age of Hollywood', years:'1930s–1950s', short:'1930s–50s', c:'#d7dde7', b:'#2c3038',
   celebs:['Shirley Temple','Judy Garland','Jesse Owens','Frank Sinatra','Audrey Hepburn','Amelia Earhart']},
  {n:3, name:'TV and tabloid', years:'1960s–1990s', short:'1960s–90s', c:'#ff8f45', b:'#401f0c',
   celebs:['Muhammad Ali','Princess Diana','Bruce Lee','Oprah Winfrey','John Lennon','Pelé']},
  {n:4, name:'Early internet', years:'2000s', short:'2000s', c:'#62b8ff', b:'#0f2a46',
   celebs:['Britney Spears','David Beckham','Paris Hilton','Usain Bolt','Emma Watson','Justin Bieber']},
  {n:5, name:'Social media', years:'2010s–now', short:'2010s–now', c:'#ff62c4', b:'#3b0f2d',
   celebs:['MrBeast','Taylor Swift','Greta Thunberg','Khaby Lame','Lisa (BLACKPINK)','Cristiano Ronaldo']}
];

var CELEBS = [];
ERAS.forEach(function(E, e){ E.celebs.forEach(function(nm){ CELEBS.push({id:CELEBS.length, name:nm, era:e, c:E.c, b:E.b}); }); });
var N = STUDENTS.length;

/* ===== True randomness ===== */
function rnd(n){
  var lim = Math.floor(4294967296 / n) * n, a = new Uint32Array(1);
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % n;
}
function shuffle(arr){ for (var i = arr.length - 1; i > 0; i--){ var j = rnd(i + 1), t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
function range(n){ var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

/* Even spread across the five eras: 17 → 4,4,3,3,3 (which eras get the extra one is random) */
function balancedPick(){
  var base = Math.floor(N / ERAS.length), extra = N % ERAS.length, rank = shuffle(range(ERAS.length)), pool = [];
  ERAS.forEach(function(E, e){
    var q = Math.min(E.celebs.length, base + (rank.indexOf(e) < extra ? 1 : 0));
    var ids = shuffle(CELEBS.filter(function(c){ return c.era === e; }).map(function(c){ return c.id; }));
    pool = pool.concat(ids.slice(0, q));
  });
  return shuffle(pool);
}

/* ===== State ===== */
var assign = new Array(N).fill(null), owner = new Array(CELEBS.length).fill(-1);
var drawn = false, busy = false, sel = -1, S = 1;
var stage = document.getElementById('stage');
document.getElementById('pill').textContent = 'Class ' + CLASS_NAME;

/* ===== Build cards ===== */
var cards = [], studentsEl = document.getElementById('students');
STUDENTS.forEach(function(name, i){
  var card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<div class="badge"></div><div class="info"><div class="top"><div class="sname"></div><div class="era"></div></div><div class="frame"><div class="win"></div></div></div>';
  card.querySelector('.badge').textContent = name.charAt(0).toUpperCase();
  card.querySelector('.sname').textContent = name;
  card.addEventListener('click', function(e){ e.stopPropagation(); cardClick(i); });
  studentsEl.appendChild(card);
  cards.push({card:card, sname:card.querySelector('.sname'), era:card.querySelector('.era'), frame:card.querySelector('.frame'), win:card.querySelector('.win')});
});

/* ===== Build archive ===== */
var chips = [], ecounts = [], erasEl = document.getElementById('eras');
ERAS.forEach(function(E, e){
  var blk = document.createElement('div'); blk.className = 'eblock'; blk.style.borderLeftColor = E.c;
  var head = document.createElement('div'); head.className = 'ehead';
  var et = document.createElement('span'); et.className = 'et';
  var b = document.createElement('b'); b.style.color = E.c; b.textContent = 'ERA ' + E.n;
  et.appendChild(b); et.appendChild(document.createTextNode(' · ' + E.name + ' · ' + E.years));
  var cnt = document.createElement('span'); cnt.className = 'ecount';
  head.appendChild(et); head.appendChild(cnt); blk.appendChild(head); ecounts.push(cnt);
  var grid = document.createElement('div'); grid.className = 'chips';
  CELEBS.filter(function(c){ return c.era === e; }).forEach(function(c){
    var ch = document.createElement('div'); ch.className = 'chip';
    ch.style.background = c.b; ch.style.borderColor = c.c; ch.style.setProperty('--ec', c.c);
    ch.innerHTML = '<div class="n"></div><div class="o"></div>';
    ch.querySelector('.n').textContent = c.name; ch.querySelector('.o').style.color = c.c;
    ch.addEventListener('click', function(ev){ ev.stopPropagation(); chipClick(c.id); });
    grid.appendChild(ch); chips[c.id] = ch;
  });
  blk.appendChild(grid); erasEl.appendChild(blk);
});

/* ===== Rendering ===== */
function fit(el, max, min){
  var s = max; el.style.fontSize = s + 'px';
  while (el.scrollWidth > el.clientWidth + 1 && s > min){ s--; el.style.fontSize = s + 'px'; }
}
function mkItem(c){
  var d = document.createElement('div'); d.className = 'ri';
  d.style.background = c.b; d.style.borderLeftColor = c.c; d.textContent = c.name;
  return d;
}
function setFrame(i){
  var C = cards[i], id = assign[i];
  C.win.innerHTML = '';
  if (id === null){
    var p = document.createElement('div'); p.className = 'ri ph'; p.textContent = '? ? ?'; C.win.appendChild(p);
    C.era.textContent = '';
  } else {
    var c = CELEBS[id], it = mkItem(c); C.win.appendChild(it); fit(it, 29, 18);
    C.era.textContent = 'ERA ' + ERAS[c.era].n + ' · ' + ERAS[c.era].short; C.era.style.color = c.c;
  }
}
function renderArchive(){
  var used = [0,0,0,0,0];
  CELEBS.forEach(function(c){
    var ch = chips[c.id], o = owner[c.id];
    ch.classList.toggle('taken', o >= 0);
    ch.querySelector('.o').textContent = o >= 0 ? '→ ' + STUDENTS[o] : '';
    if (o >= 0) used[c.era]++;
  });
  ecounts.forEach(function(el, e){ el.textContent = used[e] + '/' + ERAS[e].celebs.length + ' drawn'; });
}
function pulseChip(id){ var ch = chips[id]; ch.classList.remove('pulse'); void ch.offsetWidth; ch.classList.add('pulse'); setTimeout(function(){ ch.classList.remove('pulse'); }, 850); }
function popCard(i){ var c = cards[i].card; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); setTimeout(function(){ c.classList.remove('pop'); }, 750); }

/* ===== Bottom bar ===== */
var hint = document.getElementById('hint'), drawBtn = document.getElementById('drawBtn'),
    randBtn = document.getElementById('randBtn'), redrawBtn = document.getElementById('redrawBtn');
function updateBar(){
  stage.classList.toggle('ready', drawn && !busy);
  stage.classList.toggle('picking', sel >= 0);
  drawBtn.hidden = drawn || busy;
  randBtn.hidden = redrawBtn.hidden = !drawn && !busy ? true : !drawn;
  randBtn.disabled = sel < 0 || busy;
  redrawBtn.disabled = busy;
  if (!drawn && busy){ hint.innerHTML = 'Drawing stars from the archive…'; randBtn.hidden = redrawBtn.hidden = true; }
  else if (!drawn) hint.innerHTML = 'Every student gets a star from one of five eras of fame.';
  else if (busy) hint.innerHTML = 'Swapping…';
  else if (sel < 0) hint.innerHTML = 'Click a student to swap their celebrity.';
  else hint.innerHTML = '<b></b> selected · click a student to trade · click a bright name to swap in · or Random Swap · Esc cancels';
  if (drawn && !busy && sel >= 0) hint.querySelector('b').textContent = STUDENTS[sel];
}

/* ===== Selection ===== */
function select(i){ deselect(true); sel = i; cards[i].card.classList.add('sel'); updateBar(); }
function deselect(quiet){ if (sel >= 0) cards[sel].card.classList.remove('sel'); sel = -1; if (!quiet) updateBar(); }
function cardClick(i){
  if (busy || !drawn) return;
  if (sel < 0) select(i);
  else if (sel === i) deselect();
  else swapStudents(sel, i);
}
function chipClick(id){
  if (busy || !drawn) return;
  var o = owner[id];
  if (sel < 0){ if (o >= 0) select(o); return; }
  if (o === sel){ deselect(); return; }
  if (o >= 0) swapStudents(sel, o); else swapUnused(sel, id);
}
stage.addEventListener('click', function(e){ if (!e.target.closest('.btn')) { if (sel >= 0 && !busy) deselect(); } });

/* ===== Reel spin (draw + random swap) ===== */
var ITEM_H = 42;
function spin(jobs, done){
  jobs.forEach(function(j){
    var L = Math.max(14, Math.round(2100 * j.d / 3 / ITEM_H)), seq = [j.target], prev = j.target;
    for (var k = 1; k < L; k++){ var id; do { id = Math.floor(Math.random() * CELEBS.length); } while (id === prev); seq.push(id); prev = id; }
    var reel = document.createElement('div'); reel.className = 'reel';
    seq.forEach(function(id){ reel.appendChild(mkItem(CELEBS[id])); });
    var C = cards[j.i]; C.win.innerHTML = ''; C.win.appendChild(reel);
    C.frame.classList.add('spinning'); C.era.textContent = '· · ·'; C.era.style.color = '#c9bba6';
    j.reel = reel; j.L = L; j.done = false;
    reel.style.transform = 'translateY(' + (-(L - 1) * ITEM_H) + 'px)';
  });
  var t0 = performance.now();
  function step(now){
    var t = (now - t0) / 1000, all = true;
    jobs.forEach(function(j){
      if (j.done) return;
      var p = Math.min(1, t / j.d), e = 1 - Math.pow(1 - p, 3), b = 2.4 * Math.pow(1 - p, 2);
      j.reel.style.transform = 'translateY(' + (-(j.L - 1) * ITEM_H * (1 - e)).toFixed(1) + 'px)';
      j.reel.style.filter = b > 0.15 ? 'blur(' + b.toFixed(2) + 'px)' : 'none';
      if (p >= 1){ j.done = true; land(j); } else all = false;
    });
    if (!all) requestAnimationFrame(step); else if (done) done();
  }
  requestAnimationFrame(step);
}
function land(j){
  cards[j.i].frame.classList.remove('spinning');
  setFrame(j.i); popCard(j.i);
  if (j.onLand) j.onLand(); else { owner[j.target] = j.i; renderArchive(); pulseChip(j.target); }
}

/* ===== The draw: all students at once, one 7-second animation ===== */
function draw(){
  if (busy) return;
  deselect(true); busy = true; drawn = false;
  owner.fill(-1); assign = balancedPick(); renderArchive(); updateBar();
  var order = shuffle(range(N));
  var jobs = order.map(function(i, k){ return {i:i, target:assign[i], d:4.2 + 2.8 * k / Math.max(1, N - 1)}; });
  spin(jobs, function(){ busy = false; drawn = true; updateBar(); });
}

/* ===== Swaps ===== */
function rectOf(el){
  var s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return {x:(r.left - s.left) / S, y:(r.top - s.top) / S, w:r.width / S, h:r.height / S};
}
function fly(c, from, to, bend, done){
  var el = document.createElement('div'); el.className = 'flyer';
  el.style.background = c.b; el.style.borderColor = c.c; el.style.boxShadow = '0 14px 30px rgba(0,0,0,.65),0 0 22px ' + c.c;
  el.textContent = c.name; document.getElementById('fly').appendChild(el);
  var sx = from.x + from.w / 2, sy = from.y + from.h / 2, ex = to.x + to.w / 2, ey = to.y + to.h / 2;
  var dist = Math.hypot(ex - sx, ey - sy), cx = (sx + ex) / 2, cy = (sy + ey) / 2 - bend * (90 + dist * 0.28);
  var t0 = performance.now(), D = 820;
  function step(now){
    var p = Math.min(1, (now - t0) / D), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, u = 1 - e;
    var x = u * u * sx + 2 * u * e * cx + e * e * ex, y = u * u * sy + 2 * u * e * cy + e * e * ey;
    var w = from.w + (to.w - from.w) * e, h = from.h + (to.h - from.h) * e, sc = 1 + 0.18 * Math.sin(Math.PI * p);
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.transform = 'translate(' + (x - w / 2) + 'px,' + (y - h / 2) + 'px) scale(' + sc + ')';
    if (p < 1) requestAnimationFrame(step); else { el.remove(); if (done) done(); }
  }
  requestAnimationFrame(step);
}
function finishSwap(n){ var left = n; return function(){ if (--left === 0){ busy = false; updateBar(); } }; }

function swapStudents(a, b){
  var ra = rectOf(cards[a].win), rb = rectOf(cards[b].win), ca = assign[a], cb = assign[b];
  deselect(true); busy = true;
  assign[a] = cb; assign[b] = ca; owner[ca] = b; owner[cb] = a;

  renderArchive(); updateBar();
  var fin = finishSwap(2);

  fly(CELEBS[cb], rb, ra, -1, function(){ arrive(a); fin(); });
}

  var old = assign[a], ra = rectOf(cards[a].win), rNew = rectOf(chips[id]), rOld = rectOf(chips[old]);
  deselect(true); busy = true;
  assign[a] = id; owner[old] = -1; owner[id] = a;
  setFrame(a); cards[a].win.classList.add('hide'); cards[a].card.classList.add('incoming');
  renderArchive(); chips[old].classList.add('hide'); updateBar();
  var fin = finishSwap(2);
  fly(CELEBS[id], rNew, ra, 1, function(){ arrive(a); pulseChip(id); fin(); });
  fly(CELEBS[old], ra, rOld, -1, function(){ chips[old].classList.remove('hide'); pulseChip(old); fin(); });
}

function randomSwap(){
  if (busy || sel < 0) return;
  var i = sel, old = assign[i], era = CELEBS[old].era;
  var cand = CELEBS.filter(function(c){ return c.era === era && owner[c.id] < 0; }).map(function(c){ return c.id; });
  if (!cand.length) return;
  var nw = cand[rnd(cand.length)];
  deselect(true); busy = true; assign[i] = nw; updateBar();
  spin([{i:i, target:nw, d:1.8, onLand:function(){ owner[old] = -1; owner[nw] = i; renderArchive(); pulseChip(old); pulseChip(nw); }}],
       function(){ busy = false; updateBar(); });
}

/* ===== Buttons and keys ===== */
var confirmTimer = null;
drawBtn.addEventListener('click', function(e){ e.stopPropagation(); draw(); });
randBtn.addEventListener('click', function(e){ e.stopPropagation(); randomSwap(); });
redrawBtn.addEventListener('click', function(e){
  e.stopPropagation(); if (busy) return;
  if (!redrawBtn.classList.contains('warn')){
    redrawBtn.classList.add('warn'); redrawBtn.textContent = 'Click again to redraw all';
    confirmTimer = setTimeout(resetRedraw, 3000); return;
  }
  resetRedraw(); draw();
});
function resetRedraw(){ clearTimeout(confirmTimer); redrawBtn.classList.remove('warn'); redrawBtn.textContent = 'Draw Again'; }
document.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if (!drawn && !busy) draw(); }
  else if (e.key === 'Escape'){ if (!busy) deselect(); }
  else if (e.key === 'r' || e.key === 'R'){ randomSwap(); }
});

/* ===== Scale stage to fit ===== */
function fitStage(){
  S = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = 'translate(' + ((innerWidth - 1920 * S) / 2) + 'px,' + ((innerHeight - 1080 * S) / 2) + 'px) scale(' + S + ')';
}
addEventListener('resize', fitStage); fitStage();

function fitAll(){
  cards.forEach(function(C, i){ fit(C.sname, 32, 22); if (assign[i] !== null) { var it = C.win.querySelector('.ri'); if (it) fit(it, 29, 18); } });
  chips.forEach(function(ch){ fit(ch.querySelector('.n'), 20, 13); });
  document.querySelectorAll('.et').forEach(function(el){ fit(el, 16, 12); });
}
for (var i = 0; i < N; i++) setFrame(i);
renderArchive(); updateBar(); fitAll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
