<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fame Through the Decades – Celebrity Draw (10A1)</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Oswald:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#f2c14e;--cream:#fff6e3;--panel:#130e0b;--card:#1d1512;
    --display:'Limelight',Georgia,serif;--cond:'Oswald','Arial Narrow','Roboto Condensed',sans-serif;--body:'Atkinson Hyperlegible',Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#080605;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
    font-family:var(--body);color:var(--cream);user-select:none;-webkit-user-select:none}
  #bg{position:absolute;left:0;top:0;width:1920px;height:1080px}

  /* Slides */
  .slide{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
  .slide.on{opacity:1;visibility:visible;transition:opacity .45s}

  /* Header */
  .plate{position:absolute;left:40px;top:24px;padding:12px 34px 16px;background:var(--panel);border:2px solid #5d4428;border-radius:18px;
    box-shadow:0 10px 28px rgba(0,0,0,.6)}
  .kicker{font:700 20px var(--body);letter-spacing:.34em;color:var(--gold)}
  h1{font:400 58px/1.05 var(--display);color:var(--cream);margin-top:4px;letter-spacing:.01em;white-space:nowrap}
  .pill{position:absolute;right:40px;top:50px;padding:10px 30px;border-radius:999px;background:var(--gold);color:#1a1205;z-index:5;
    font:700 30px var(--cond);letter-spacing:.04em;border:3px solid #fff1c7;box-shadow:0 8px 22px rgba(0,0,0,.55)}

  /* Slide 1: five eras */
  .question{position:absolute;left:40px;right:40px;top:168px;height:66px;background:var(--panel);border:2px solid #5d4428;border-radius:14px;
    display:flex;align-items:center;justify-content:center;font:700 32px var(--body);color:var(--cream);box-shadow:0 8px 22px rgba(0,0,0,.55)}
  .question em{font-style:normal;color:var(--gold)}
  .eras5{position:absolute;left:40px;right:40px;top:256px;height:700px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
  .ecol{background:var(--card);border:2px solid #3f2f23;border-top:8px solid;border-radius:14px;padding:16px;display:flex;flex-direction:column;
    box-shadow:0 10px 26px rgba(0,0,0,.55);cursor:pointer;transition:transform .2s}
  .ecol:hover{transform:translateY(-4px)}
  .ecol img{width:100%;aspect-ratio:230/140;border-radius:6px;border:3px solid #050302;display:block}
  .ecol .en{font:700 30px var(--cond);letter-spacing:.08em;margin-top:16px}
  .ecol .nm{font:600 34px/1.12 var(--cond);color:#fff;margin-top:4px;min-height:76px}
  .ecol .yr{font:700 27px var(--body);margin-top:6px}
  .ecol .ds{font:400 29px/1.38 var(--body);color:#f1e7d6;margin-top:14px}

  /* Era slides */
  .edesc{position:absolute;left:40px;right:40px;top:168px;min-height:66px;background:var(--panel);border:2px solid #5d4428;border-left:10px solid;border-radius:14px;
    display:flex;align-items:center;padding:8px 28px;font:400 30px/1.3 var(--body);color:var(--cream);box-shadow:0 8px 22px rgba(0,0,0,.55)}
  .egrid{position:absolute;left:40px;right:40px;top:256px;height:702px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:24px}
  .ccard{min-width:0;background:var(--card);border:2px solid #3f2f23;border-left:10px solid;border-radius:16px;padding:22px 26px;display:flex;flex-direction:column;
    box-shadow:0 10px 26px rgba(0,0,0,.55)}
  .slide.on .ccard{animation:rise .6s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(40px)}}
  .crow{display:flex;align-items:center;gap:22px}
  .medal{flex:0 0 132px;height:132px;border-radius:50%;border:5px solid;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 6px rgba(0,0,0,.35)}
  .medal svg{width:92px;height:92px;fill:none;stroke:#fff6e3;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .cside{flex:1;min-width:0}
  .cname{font:600 50px/1.1 var(--cond);color:#fff;white-space:nowrap;overflow:hidden;letter-spacing:.01em}
  .cdates{font:700 24px var(--body);margin-top:4px}
  .known{font:400 30px/1.36 var(--body);color:#f1e7d6;margin-top:20px;flex:1}
  .wiki{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font:700 22px var(--body);color:var(--cream);text-decoration:none;
    padding:6px 18px;border-radius:999px;border:2px solid;background:#120d0b}
  .wiki:hover{background:#2a1f18}

  /* Selection slide: student cards */
  #students{position:absolute;left:40px;top:166px;width:1230px;height:794px;display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:14px 16px}
  .card{position:relative;min-width:0;background:var(--card);border:2px solid #3f2f23;border-radius:16px;display:flex;align-items:center;
    padding:0 16px;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s,border-color .2s}
  .ready .card{cursor:pointer}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .top{display:flex;align-items:baseline;gap:10px;height:36px}
  .sname{flex:1;min-width:0;font:600 34px/36px var(--cond);color:#fff;white-space:nowrap;overflow:hidden;letter-spacing:.02em}
  .era{flex:0 0 auto;font:700 18px var(--body);letter-spacing:.04em;white-space:nowrap}
  .frame{position:relative;height:68px;border-radius:6px;background:#070505;padding:7px 0;overflow:hidden}
  .frame::before,.frame::after{content:'';position:absolute;left:0;right:0;height:4px;
    background:repeating-linear-gradient(90deg,rgba(255,238,205,.6) 0 8px,transparent 8px 16px)}
  .frame::before{top:1.5px}.frame::after{bottom:1.5px}
  .frame.spinning::before,.frame.spinning::after{animation:sprocket .25s linear infinite}
  @keyframes sprocket{to{background-position:16px 0}}
  .win{position:relative;height:54px;overflow:hidden;border-radius:3px}
  .win.hide>*{visibility:hidden}
  .reel{position:absolute;left:0;right:0;top:0;will-change:transform}
  .ri{display:block;height:54px;line-height:54px;padding:0 12px;border-left:7px solid;font:600 42px var(--cond);color:#fff;
    white-space:nowrap;overflow:hidden;letter-spacing:.01em}
  .ri.ph{background:#2a201a;border-color:#6d5a47;color:#c9bba6;letter-spacing:.4em}
  .ri.fin{display:flex;align-items:center;gap:10px;padding-right:8px}
  .ri.fin .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
  .wl{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border:2px solid;opacity:.8;transition:opacity .15s,transform .15s}
  .wl:hover{opacity:1;transform:scale(1.12)}
  .wl svg{width:16px;height:16px}
  .card.sel{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 0 0 4px rgba(242,193,78,.55),0 0 36px rgba(242,193,78,.65)}
  .picking .card:not(.sel):hover{border-color:#fff6e3}
  .card.pop .win{animation:landFlash .7s ease-out}
  @keyframes landFlash{0%{transform:scale(1.07);filter:brightness(1.7)}100%{transform:scale(1);filter:none}}
  .card.incoming .era{visibility:hidden}

  /* Archive */
  #archive{position:absolute;left:1296px;top:166px;width:584px;height:794px;background:var(--panel);border:2px solid #5d4428;border-radius:16px;
    padding:10px 12px 12px;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(0,0,0,.6)}
  .ahead{display:flex;align-items:baseline;justify-content:space-between;height:32px;padding:0 4px}
  .ahead .t{font:400 24px var(--display);color:var(--gold)}
  .ahead .h{font:700 15px var(--body);color:#e9dcc6;letter-spacing:.06em}
  #eras{flex:1;display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .eblock{flex:1;background:#1c1411;border:1px solid #3d2e22;border-left:6px solid;border-radius:10px;padding:6px 10px 8px;display:flex;flex-direction:column}
  .ehead{display:flex;align-items:center;justify-content:space-between;gap:10px;height:24px}
  .et{flex:1;min-width:0;font:400 16px var(--body);color:#efe4d2;white-space:nowrap;overflow:hidden}
  .et b{font-weight:700}
  .ecount{flex:0 0 auto;font:700 15px var(--body);color:#fff6e3;background:#2f241c;border-radius:999px;padding:1px 10px}
  .chips{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:6px;margin-top:6px}
  .chip{min-width:0;min-height:0;border-radius:7px;border:2px solid;display:flex;flex-direction:column;justify-content:center;padding:0 9px;overflow:hidden;
    transition:background .3s,border-color .3s}
  .chip .n{font:600 23px/25px var(--cond);color:#fff;white-space:nowrap;overflow:hidden;letter-spacing:.01em}
  .chip .o{font:700 14px/15px var(--body);white-space:nowrap;overflow:hidden;display:none}
  .chip.taken{background:#110c0a!important;border-color:#3b2e25!important}
  .chip.taken .n{color:#ab9d8a;font-size:20px;line-height:22px}
  .chip.taken .o{display:block}
  .chip.hide .n,.chip.hide .o{visibility:hidden}
  .ready .chip{cursor:pointer}
  .picking .chip:not(.taken){animation:chipGlow 1.4s ease-in-out infinite}
  @keyframes chipGlow{50%{box-shadow:0 0 0 2px #fff6e3,0 0 18px var(--ec)}}
  .chip.pulse{animation:chipPulse .8s ease-out!important}
  @keyframes chipPulse{0%{transform:scale(1.12);box-shadow:0 0 26px var(--ec)}100%{transform:scale(1)}}

  /* Save box */
  #savebox{position:absolute;right:300px;top:52px;display:flex;align-items:center;gap:12px}
  #saveState{background:var(--panel);border:2px solid #5d4428;border-radius:999px;padding:9px 20px;font:700 20px var(--body);color:#e9dcc6;white-space:nowrap}
  #saveState.ok{color:#9be3a4;border-color:#3f7a49}
  #saveState.bad{color:#ffb3a8;border-color:#8a3b31}
  .btn.small{font-size:22px;padding:8px 20px;gap:8px;box-shadow:0 4px 0 #0a0706,0 8px 18px rgba(0,0,0,.5)}
  .btn.small svg{width:24px;height:24px}

  /* Bottom bar */
  #bar{position:absolute;left:290px;right:40px;top:978px;height:80px;display:flex;align-items:center;justify-content:center;gap:22px}
  #hint{background:var(--panel);border:2px solid #5d4428;border-radius:999px;padding:12px 28px;font:400 22px var(--body);color:var(--cream);
    max-width:900px;white-space:nowrap;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.55)}
  #hint b{color:var(--gold)}
  .btn{display:inline-flex;align-items:center;gap:12px;font:600 30px var(--cond);letter-spacing:.06em;padding:10px 34px;border-radius:999px;border:3px solid #fff1c7;
    background:linear-gradient(#ffd977,#e6a42a);color:#1a1205;cursor:pointer;box-shadow:0 6px 0 #8a5a12,0 12px 26px rgba(0,0,0,.55);transition:transform .12s,opacity .2s}
  .btn:hover:not(:disabled){transform:translateY(-2px)}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #8a5a12,0 8px 18px rgba(0,0,0,.55)}
  .btn.ghost{background:#1d1512;color:var(--cream);border-color:#7a5c3c;box-shadow:0 6px 0 #0a0706,0 12px 26px rgba(0,0,0,.55)}
  .btn.warn{background:#7d1d1d;border-color:#ffb3a8;color:#fff}
  .btn:disabled{background:#3a2f26;color:#a39582;border-color:#5d4428;box-shadow:0 6px 0 #0a0706;cursor:default}
  .btn[hidden]{display:none}
  .btn svg{width:30px;height:30px}

  /* Slide navigation */
  #nav{position:absolute;left:40px;top:984px;height:68px;display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid #5d4428;
    border-radius:999px;padding:0 8px;z-index:20;box-shadow:0 8px 22px rgba(0,0,0,.55)}
  #nav button{width:52px;height:52px;border-radius:50%;border:2px solid #7a5c3c;background:#2a1f18;color:var(--cream);cursor:pointer;display:flex;align-items:center;justify-content:center}
  #nav button:hover:not(:disabled){background:#3a2b20;border-color:var(--gold)}
  #nav button:disabled{opacity:.35;cursor:default}
  #nav svg{width:22px;height:22px;fill:var(--cream)}
  #count{font:600 26px var(--cond);min-width:76px;text-align:center;color:var(--cream)}

  #fly{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:50}
  .flyer{position:absolute;left:0;top:0;display:flex;align-items:center;padding:0 12px;border:2px solid;border-left-width:7px;border-radius:6px;
    font:600 32px var(--cond);color:#fff;white-space:nowrap;overflow:hidden;letter-spacing:.01em;transform-origin:center}

  /* Finalized: Day 1 / Day 2 presentation order */
  .btn.mid{font-size:26px;padding:10px 26px;gap:10px}
  .btn.mid svg{width:26px;height:26px}
  #pick.final #students,#pick.final #archive{display:none}
  #dayview{position:absolute;left:40px;top:166px;width:1840px;height:794px;display:none}
  #pick.final #dayview{display:block}
  #pick.revealing{cursor:pointer}
  .dayhead{position:absolute;left:0;right:0;height:54px;display:flex;align-items:center;gap:16px}
  .daylab{font:400 32px/1.2 var(--display);color:#1a1205;background:var(--gold);border:3px solid #fff1c7;border-radius:999px;padding:2px 28px;box-shadow:0 6px 16px rgba(0,0,0,.5);white-space:nowrap}
  .daymsg{flex:1;min-width:0;background:var(--panel);border:2px solid #5d4428;border-radius:999px;padding:8px 26px;font:700 26px var(--body);color:#c9bba6;
    white-space:nowrap;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.5);transition:border-color .4s,color .4s}
  .daymsg.on{border-color:var(--gold);color:#fff;animation:msgIn .6s ease-out}
  @keyframes msgIn{from{transform:translateX(-20px);opacity:0}}
  .daymsg.on b{color:var(--gold)}
  .pc{position:absolute;left:0;top:0;perspective:1400px}
  .pcin{position:absolute;left:0;top:0;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
  .pc.down .pcin{transform:rotateY(180deg)}
  .face{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 8px 20px rgba(0,0,0,.55)}
  .front{background:var(--card);border:2px solid #3f2f23;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;gap:5px}
  .back{transform:rotateY(180deg);background:#0d0907;border:3px solid #6b5137;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .back::before,.back::after{content:'';position:absolute;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,rgba(255,238,205,.5) 0 14px,transparent 14px 28px)}
  .back::before{top:9px}.back::after{bottom:9px}
  .bnum{font:400 92px/1 var(--display);color:var(--gold)}
  .pc .pn{font:600 34px/38px var(--cond);color:#fff;white-space:nowrap;overflow:hidden;letter-spacing:.02em}
  .pc.shown .pn{padding-right:76px}
  .pc .pf{display:flex;align-items:center;gap:10px;height:58px;border-left:7px solid;border-radius:4px;padding:0 8px 0 12px}
  .pc .pf .t{flex:1;min-width:0;font:600 40px var(--cond);color:#fff;white-space:nowrap;overflow:hidden;letter-spacing:.01em}
  .pc .pe{font:700 18px var(--body);letter-spacing:.04em}
  .ord{position:absolute;top:10px;right:12px;font:700 22px var(--cond);letter-spacing:.08em;color:#1a1205;background:var(--gold);border-radius:999px;padding:1px 14px;display:none}
  .pc.shown .ord{display:block}
  .pc.shown .front{border-color:#6b5137}
  .pc.next .back{border-color:var(--gold);animation:nextGlow 1.3s ease-in-out infinite}
  @keyframes nextGlow{50%{box-shadow:0 0 0 4px rgba(242,193,78,.6),0 0 44px rgba(242,193,78,.8)}}
  .pc.bump .back{animation:bump .5s ease-out}
  @keyframes bump{0%{transform:rotateY(180deg) scale(1.08);filter:brightness(1.6)}100%{transform:rotateY(180deg) scale(1)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div class="pill" id="pill"></div>
  <div id="slides"></div>

  <section class="slide" id="pick">
    <div class="plate"><div class="kicker">◆ Celebrity Draw ◆</div><h1>Fame Through the Decades</h1></div>
    <div id="savebox">
      <div id="saveState">Not saved yet</div>
      <button class="btn ghost small" id="dlBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16" fill="none" stroke="#fff6e3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Download List</button>
    </div>
    <div id="students"></div>
    <section id="archive">
      <div class="ahead"><span class="t">The Archive</span><span class="h">BRIGHT = STILL AVAILABLE</span></div>
      <div id="eras"></div>
    </section>
    <div id="dayview">
      <div class="dayhead" style="top:0"><span class="daylab">Day 1</span><span class="daymsg" id="dm0"></span></div>
      <div class="dayhead" style="top:405px"><span class="daylab">Day 2</span><span class="daymsg" id="dm1"></span></div>
    </div>
    <div id="bar">
      <div id="hint"></div>
      <button class="btn" id="drawBtn">Draw Celebrities</button>
      <button class="btn mid" id="randBtn" hidden><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="3" width="24" height="24" rx="6" fill="#fff6e3" stroke="#1a1205" stroke-width="2.5"/><circle cx="10" cy="10" r="2.6" fill="#1a1205"/><circle cx="20" cy="20" r="2.6" fill="#1a1205"/><circle cx="15" cy="15" r="2.6" fill="#1a1205"/><circle cx="20" cy="10" r="2.6" fill="#1a1205"/><circle cx="10" cy="20" r="2.6" fill="#1a1205"/></svg>Random Swap</button>
      <button class="btn ghost mid" id="redrawBtn" hidden>Draw Again</button>
      <button class="btn mid" id="finalBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2" fill="#1a1205"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#1a1205" stroke-width="2.6"/></svg>Celebrities Finalized</button>
      <button class="btn" id="shuffleBtn" hidden>Shuffle Presentation Order</button>
      <button class="btn" id="againBtn" hidden>Shuffle Again</button>
      <button class="btn ghost mid" id="unlockBtn" hidden>Unlock</button>
    </div>
  </section>

  <div id="nav">
    <button id="prevBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M16 3L6 12l10 9z"/></svg></button>
    <div id="count"></div>
    <button id="nextBtn" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M8 3l10 9-10 9z"/></svg></button>
  </div>
  <div id="fly"></div>
</div>

<script>
/* ===== Edit here: class and students ===== */
var CLASS_NAME = '10A1';
var STUDENTS = ['Aavni','Andy','Ashley','Bob','Camry','Felicia','Henry','Izza','Jena','Jeremy','Katie','Kevin','Lam','Melissa','Nicky','Sam','Tony'];

/* ===== Celebrity list by era (name, life dates, what they're known for, icon, Wikipedia article) ===== */
var ERAS = [
  {n:1, name:'Pre-mass-media', years:'up to 1920s', short:'to 1920s', c:'#e0b673', b:'#3c2a15',
   desc:'Fame spread through newspapers, books, live shows and the first silent films.',
   people:[
    ['Florence Nightingale','1820–1910','Nurse who changed hospitals forever – known as “The Lady with the Lamp”.','lamp','Florence_Nightingale'],
    ['Harry Houdini','1874–1926','Magician famous for escaping from locks, chains and water tanks.','lock','Harry_Houdini'],
    ['Marie Curie','1867–1934','Scientist who studied radioactivity – the first person to win two Nobel Prizes.','flask','Marie_Curie'],
    ['Mary Pickford','1892–1979','One of the first big stars of silent movies.','clap','Mary_Pickford'],
    ['Charlie Chaplin','1889–1977','Silent-film comedian, famous for his character “The Tramp”.','hat','Charlie_Chaplin'],
    ['Mark Twain','1835–1910','American writer of The Adventures of Tom Sawyer.','quill','Mark_Twain']]},
  {n:2, name:'Golden age of Hollywood', years:'1930s–1950s', short:'1930s–50s', c:'#d7dde7', b:'#2c3038',
   desc:'Hollywood studios, cinemas and radio turned stars into household names.',
   people:[
    ['Shirley Temple','1928–2014','Child film star who sang and danced in 1930s movies.','clap','Shirley_Temple'],
    ['Judy Garland','1922–1969','Singer and actress who played Dorothy in The Wizard of Oz.','mic','Judy_Garland'],
    ['Jesse Owens','1913–1980','Athlete who won four gold medals at the 1936 Olympics.','medal','Jesse_Owens'],
    ['Frank Sinatra','1915–1998','Singer and actor with millions of radio and record fans.','mic','Frank_Sinatra'],
    ['Audrey Hepburn','1929–1993','Film star of Roman Holiday and Breakfast at Tiffany’s.','clap','Audrey_Hepburn'],
    ['Amelia Earhart','1897–1937','Pilot – the first woman to fly alone across the Atlantic.','plane','Amelia_Earhart']]},
  {n:3, name:'TV and tabloid', years:'1960s–1990s', short:'1960s–90s', c:'#ff8f45', b:'#401f0c',

function spin(jobs, done){
  jobs.forEach(function(j){
    var L = Math.max(14, Math.round(2400 * j.d / 3 / ITEM_H)), seq = [j.target], prev = j.target;
    for (var k = 1; k < L; k++){ var id; do { id = Math.floor(Math.random() * CELEBS.length); } while (id === prev); seq.push(id); prev = id; }
    var reel = el('div', 'reel');
    seq.forEach(function(id){ reel.appendChild(mkItem(CELEBS[id])); });
    var C = cards[j.i]; C.win.innerHTML = ''; C.win.appendChild(reel);
    C.frame.classList.add('spinning'); C.era.textContent = '· · ·'; C.era.style.color = '#c9bba6';
    j.reel = reel; j.L = L; j.done = false;
    reel.style.transform = 'translateY(' + (-(L - 1) * ITEM_H) + 'px)';
  });
  var t0 = performance.now();
  function step(now){
    var t = (now - t0) / 1000, all = true;
    jobs.forEach(function(j){
      if (j.done) return;
      var p = Math.min(1, t / j.d), e = 1 - Math.pow(1 - p, 3), b = 2.6 * Math.pow(1 - p, 2);
      j.reel.style.transform = 'translateY(' + (-(j.L - 1) * ITEM_H * (1 - e)).toFixed(1) + 'px)';
      j.reel.style.filter = b > 0.15 ? 'blur(' + b.toFixed(2) + 'px)' : 'none';
      if (p >= 1){ j.done = true; land(j); } else all = false;
    });
    if (!all) requestAnimationFrame(step); else if (done) done();
  }
  requestAnimationFrame(step);
}
function land(j){
  cards[j.i].frame.classList.remove('spinning');
  setFrame(j.i); popCard(j.i);
  if (j.onLand) j.onLand(); else { owner[j.target] = j.i; renderArchive(); pulseChip(j.target); }
}

/* ===== The draw: all students at once, one 7-second animation ===== */
function draw(){
  if (busy) return;
  deselect(true); busy = true; drawn = false;
  owner.fill(-1); assign = balancedPick(); renderArchive(); updateBar(); showSave(null); dlBtn.hidden = true;
  var order = shuffle(range(N));
  var jobs = order.map(function(i, k){ return {i:i, target:assign[i], d:4.2 + 2.8 * k / Math.max(1, N - 1)}; });
  spin(jobs, function(){ busy = false; drawn = true; save(); updateBar(); });
}

/* ===== Swaps ===== */
function rectOf(node){
  var s = stage.getBoundingClientRect(), r = node.getBoundingClientRect();
  return {x:(r.left - s.left) / S, y:(r.top - s.top) / S, w:r.width / S, h:r.height / S};
}
function fly(c, from, to, bend, done){
  var f = el('div', 'flyer');
  f.style.background = c.b; f.style.borderColor = c.c; f.style.boxShadow = '0 14px 30px rgba(0,0,0,.65),0 0 22px ' + c.c;
  f.textContent = c.name; document.getElementById('fly').appendChild(f);
  var sx = from.x + from.w / 2, sy = from.y + from.h / 2, ex = to.x + to.w / 2, ey = to.y + to.h / 2;
  var dist = Math.hypot(ex - sx, ey - sy), cx = (sx + ex) / 2, cy = (sy + ey) / 2 - bend * (90 + dist * 0.28);
  var t0 = performance.now(), D = 820;
  function step(now){
    var p = Math.min(1, (now - t0) / D), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, u = 1 - e;
    var x = u * u * sx + 2 * u * e * cx + e * e * ex, y = u * u * sy + 2 * u * e * cy + e * e * ey;
    var w = from.w + (to.w - from.w) * e, h = from.h + (to.h - from.h) * e, sc = 1 + 0.18 * Math.sin(Math.PI * p);
    f.style.width = w + 'px'; f.style.height = h + 'px';
    f.style.transform = 'translate(' + (x - w / 2) + 'px,' + (y - h / 2) + 'px) scale(' + sc + ')';
    if (p < 1) requestAnimationFrame(step); else { f.remove(); if (done) done(); }
  }
  requestAnimationFrame(step);
}
function finishSwap(n){ var left = n; return function(){ if (--left === 0){ busy = false; save(); updateBar(); } }; }
function arrive(i){ cards[i].win.classList.remove('hide'); cards[i].card.classList.remove('incoming'); popCard(i); }

function swapStudents(a, b){
  var ra = rectOf(cards[a].win), rb = rectOf(cards[b].win), ca = assign[a], cb = assign[b];
  deselect(true); busy = true;
  assign[a] = cb; assign[b] = ca; owner[ca] = b; owner[cb] = a;
  [a, b].forEach(function(i){ setFrame(i); cards[i].win.classList.add('hide'); cards[i].card.classList.add('incoming'); });
  renderArchive(); updateBar();
  var fin = finishSwap(2);
  fly(CELEBS[ca], ra, rb, 1, function(){ arrive(b); fin(); });
  fly(CELEBS[cb], rb, ra, -1, function(){ arrive(a); fin(); });
}
function swapUnused(a, id){
  var old = assign[a], ra = rectOf(cards[a].win), rNew = rectOf(chips[id]), rOld = rectOf(chips[old]);
  deselect(true); busy = true;
  assign[a] = id; owner[old] = -1; owner[id] = a;
  setFrame(a); cards[a].win.classList.add('hide'); cards[a].card.classList.add('incoming');
  renderArchive(); chips[old].classList.add('hide'); updateBar();
  var fin = finishSwap(2);
  fly(CELEBS[id], rNew, ra, 1, function(){ arrive(a); pulseChip(id); fin(); });
  fly(CELEBS[old], ra, rOld, -1, function(){ chips[old].classList.remove('hide'); pulseChip(old); fin(); });
}
function randomSwap(){
  if (busy || sel < 0) return;
  var i = sel, old = assign[i], era = CELEBS[old].era;
  var cand = CELEBS.filter(function(c){ return c.era === era && owner[c.id] < 0; }).map(function(c){ return c.id; });
  if (!cand.length) return;
  var nw = cand[rnd(cand.length)];
  deselect(true); busy = true; assign[i] = nw; updateBar();
  spin([{i:i, target:nw, d:1.8, onLand:function(){ owner[old] = -1; owner[nw] = i; renderArchive(); pulseChip(old); pulseChip(nw); }}],
       function(){ busy = false; save(); updateBar(); });
}

document.addEventListener('keydown', function(e){
  var k = e.key;
  if (k === 'ArrowRight'){ e.preventDefault(); if (cur === PICK && phase === 'reveal') revealNext(); else go(cur + 1); }
  else if (k === 'ArrowLeft'){ e.preventDefault(); go(cur - 1); }
  else if (k === ' ' || k === 'Enter'){
    e.preventDefault();
    if (cur < PICK) go(cur + 1); else if (phase === 'reveal') revealNext(); else if (!drawn && !busy) draw();
  }
  else if (k === 'Escape'){ if (!busy) deselect(); }
  else if ((k === 'r' || k === 'R') && cur === PICK && phase === 'pick'){ randomSwap(); }
});

/* =====================================================================
   Celebrities Finalized → random presentation order, Day 1 and Day 2
   ===================================================================== */
var DAY_SIZES = [9, 8];   /* Day 1 gets the first 9 places, Day 2 the last 8 */
var MSGS = ['Posters due the night before Day 2', 'Slideshow & poster due at the end of Day 1'];
var phase = 'pick', order = null, revealed = 0;   /* phase: pick | locked | shuffling | reveal | done */
var finalBtn = document.getElementById('finalBtn'), shuffleBtn = document.getElementById('shuffleBtn'),
    againBtn = document.getElementById('againBtn'), unlockBtn = document.getElementById('unlockBtn');
var dayview = document.getElementById('dayview'), dms = [document.getElementById('dm0'), document.getElementById('dm1')];

(function(){
  var dayTop = [0, 405];
  DAY_SIZES.forEach(function(n, d){
    var num = 1;
    [Math.ceil(n / 2), Math.floor(n / 2)].forEach(function(k, r){
      var total = k * CW + (k - 1) * 16, x0 = (1840 - total) / 2;
      for (var c = 0; c < k; c++) slotPos.push({x:x0 + c * (CW + 16), y:dayTop[d] + 64 + r * (CH + 12), day:d, num:num++});

})();

});

  a.addEventListener('click', function(ev){ ev.stopPropagation(); });

}

  });
}
function renderFinal(){
  STUDENTS.forEach(function(_, i){ fillPc(i); });
  var arr = order || range(N);
  arr.forEach(function(i, slot){
    var pc = pcs[i], p = slotPos[slot], up = !order || slot < revealed;
    placePc(i, slot);
    pc.classList.toggle('down', !up);
    pc.classList.toggle('shown', !!order && up);
    pc.classList.toggle('next', !!order && phase === 'reveal' && slot === revealed);
    pc.querySelector('.ord').textContent = ordinal(p.num);
    pc.querySelector('.bnum').textContent = order ? p.num : '?';
  });
  showMsgs(!!order);
  fitPcs();
}

function finalize(){
  if (busy || !drawn || phase !== 'pick') return;
  deselect(true); phase = 'locked'; order = null; revealed = 0;
  updateBar(); renderFinal(); save();
}
var unlockTimer = null;
function resetUnlock(){ clearTimeout(unlockTimer); unlockBtn.classList.remove('warn'); unlockBtn.textContent = 'Unlock'; }
function unlock(){
  if (busy) return;
  if (!unlockBtn.classList.contains('warn')){
    unlockBtn.classList.add('warn'); unlockBtn.textContent = 'Click again to unlock';
    unlockTimer = setTimeout(resetUnlock, 3000); return;
  }
  resetUnlock(); phase = 'pick'; order = null; revealed = 0;
  for (var i = 0; i < N; i++) setFrame(i);
  renderArchive(); updateBar(); fitAll(); save();
}

/* Smoothly carry a card along an arc between two slots */
function arcMove(pc, from, to, bend, dur, done){
  var t0 = performance.now(), dist = Math.hypot(to.x - from.x, to.y - from.y), lift = bend * (50 + dist * 0.22);
  pc.style.zIndex = 10;
  function step(now){
    var p = Math.min(1, (now - t0) / dur), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    var x = from.x + (to.x - from.x) * e, y = from.y + (to.y - from.y) * e - lift * Math.sin(Math.PI * e), sc = 1 + 0.07 * Math.sin(Math.PI * e);
    pc.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + sc + ')';
    if (p < 1) requestAnimationFrame(step); else { pc.style.zIndex = ''; pc.style.transform = 'translate(' + to.x + 'px,' + to.y + 'px)'; if (done) done(); }
  }
  requestAnimationFrame(step);
}

function shuffleOrder(){
  if (busy || (phase !== 'locked' && phase !== 'done')) return;
  resetUnlock();
  var arr = (order || range(N)).slice();
  busy = true; phase = 'shuffling'; order = null; revealed = 0;
  showMsgs(false); updateBar();
  /* 1. flip face-down one by one, left to right */
  arr.forEach(function(i, slot){
    var pc = pcs[i]; pc.classList.remove('shown', 'next');
    setTimeout(function(){ pc.querySelector('.bnum').textContent = '?'; pc.classList.add('down'); }, slot * 110);
  });
  setTimeout(function(){ runSwaps(arr); }, N * 110 + 650);
}
function runSwaps(arr){
  /* The final order is chosen truly at random first; the swaps are planned so the cards end up in exactly that order */
  var target = shuffle(range(N)), seq = [], sim = arr.slice(), k, a, b, t;
  for (k = 0; k < 6; k++){ a = rnd(N); do { b = rnd(N); } while (b === a); seq.push([a, b]); t = sim[a]; sim[a] = sim[b]; sim[b] = t; }
  for (var s0 = 0; s0 < N; s0++){
    if (sim[s0] !== target[s0]){ var j = sim.indexOf(target[s0]); seq.push([s0, j]); t = sim[s0]; sim[s0] = sim[j]; sim[j] = t; }
  }
  var idx = 0;
  function next(){
    if (idx >= seq.length){ order = target; finishShuffle(); return; }
    var p = seq[idx], dur = 540 * Math.pow(0.85, idx) + 110; idx++;   /* slow at first, then faster and faster */
    var A = arr[p[0]], B = arr[p[1]]; arr[p[0]] = B; arr[p[1]] = A;
    arcMove(pcs[A], slotPos[p[0]], slotPos[p[1]], 1, dur);
    arcMove(pcs[B], slotPos[p[1]], slotPos[p[0]], -1, dur, function(){ setTimeout(next, 30); });
  }
  next();
}
function finishShuffle(){
  order.forEach(function(i, slot){
    var pc = pcs[i];
    pc.querySelector('.ord').textContent = ordinal(slotPos[slot].num);
    setTimeout(function(){ pc.querySelector('.bnum').textContent = slotPos[slot].num; pc.classList.remove('bump'); void pc.offsetWidth; pc.classList.add('bump'); }, slot * 60);
  });
  setTimeout(function(){
    busy = false; phase = 'reveal'; revealed = 0;
    pcs[order[0]].classList.add('next');
    showMsgs(true); save(); updateBar();
  }, N * 60 + 300);
}
function revealNext(){
  if (phase !== 'reveal' || busy) return;
  var pc = pcs[order[revealed]];
  pc.classList.remove('next', 'down'); pc.classList.add('shown');
  revealed++;
  if (revealed >= N) phase = 'done'; else pcs[order[revealed]].classList.add('next');
  save(); updateBar();
}

    c.fillStyle = '#6f757e'; c.fillRect(40, 118, 36, 5);
    paint(c, function(p){ rrect(p, 44, 26, 28, 46, 13); }, [44, 26, 28, 46], '#9aa0a8', ['#c9ced5','#6f747c','#e0e3e7'], 70, 6, 0, 1.5);
    c.strokeStyle = 'rgba(30,32,36,.75)'; c.lineWidth = 1.5;
    for (var y = 34; y < 68; y += 5){ c.beginPath(); c.moveTo(48, y); c.lineTo(68, y); c.stroke(); }
    vignette(c, FW, FH, 'rgba(0,0,0,A)', .7);
    return r[0];
  }
  /* Era 3 – 1970s living-room TV */
  function era3(){
    var r = mk(FW, FH), c = r[1];
    paint(c, ALL, BOX, '#5a2a12', ['#7a3a18','#9c4a1c','#4a220e'], 200, 16, Math.PI / 2, .1);
    ['#c4561e','#e8a03a','#c4561e','#e8a03a','#c4561e','#e8a03a'].forEach(function(col, k){
      var x = k * 40 + 6; paint(c, function(p){ p.rect(x, 0, 12, 118); }, [x, 0, 12, 118], col, [col,'#f0b85a','#a8461a'], 40, 8, Math.PI / 2, .1);
    });
    paint(c, function(p){ p.rect(0, 116, FW, 24); }, [0, 116, FW, 24], '#3e2010', ['#4f2a14','#2c160a','#5c3219'], 60, 12, 0, .1);
    paint(c, function(p){ rrect(p, 50, 32, 130, 86, 12); }, [50, 32, 130, 86], '#7a4a24', ['#93592b','#5e3618','#a86a35'], 150, 10, 0, .2);
    var bars = ['#f2c14e','#e5793b','#3fb6a8','#d94f70','#6c8ee0'];
    c.save(); c.beginPath(); rrect(c, 62, 42, 86, 66, 11); c.clip();
    bars.forEach(function(col, k){ var x = 62 + k * 17.2; paint(c, function(p){ p.rect(x, 42, 17.6, 66); }, [x, 42, 17.6, 66], col, [col,'#ffffff'], 18, 6, Math.PI / 2, .2); });
    c.restore();
    c.strokeStyle = 'rgba(20,10,4,.8)'; c.lineWidth = 3; c.beginPath(); rrect(c, 62, 42, 86, 66, 11); c.stroke();
    c.fillStyle = '#e8c58a'; [[164, 58], [164, 82]].forEach(function(q){ c.beginPath(); c.arc(q[0], q[1], 6, 0, Math.PI * 2); c.fill(); });
    c.strokeStyle = '#2a1508'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(115, 32); c.lineTo(86, 6); c.moveTo(115, 32); c.lineTo(146, 8); c.stroke();
    c.fillStyle = '#2a1508'; c.beginPath(); c.arc(86, 6, 3, 0, 7); c.arc(146, 8, 3, 0, 7); c.fill();
    vignette(c, FW, FH, 'rgba(25,8,0,A)', .6);
    return r[0];
  }
  /* Era 4 – 2000s CD and flip phone */
  function era4(){
    var r = mk(FW, FH), c = r[1];
    paint(c, ALL, BOX, '#10233d', ['#1a3a63','#0b1a2e','#2a5a90','#1f4775'], 280, 16, .4, 1);
    paint(c, function(p){ p.arc(86, 72, 46, 0, Math.PI * 2); }, [40, 26, 92, 92], '#c3d1df', ['#9fdcff','#d0b3ff','#ffffff','#a5f0d5','#ffd6a5','#b8c6d6'], 240, 7, 0, Math.PI);
    c.fillStyle = '#e8eef5'; c.beginPath(); c.arc(86, 72, 14, 0, 7); c.fill();
    c.fillStyle = '#10233d'; c.beginPath(); c.arc(86, 72, 7, 0, 7); c.fill();
    c.save(); c.globalAlpha = .35; c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.arc(86, 72, 36, -2.4, -1.5); c.stroke(); c.restore();
    paint(c, function(p){ rrect(p, 152, 16, 42, 52, 8); }, [152, 16, 42, 52], '#aab4c0', ['#d6dde5','#8994a2','#eef2f6'], 60, 6, 0, 1);
    paint(c, function(p){ rrect(p, 152, 72, 42, 54, 8); }, [152, 72, 42, 54], '#9aa5b2', ['#c8d0da','#7c8795'], 60, 6, 0, 1);
    c.fillStyle = '#4b5562'; c.fillRect(156, 68, 34, 5);
    paint(c, function(p){ rrect(p, 158, 23, 30, 36, 3); }, [158, 23, 30, 36], '#5fd0ff', ['#8fe2ff','#3bb3e8','#c9f2ff'], 30, 5, 0, 1);
    c.fillStyle = '#3d4652';
    for (var row = 0; row < 3; row++) for (var col = 0; col < 3; col++){ c.beginPath(); c.arc(162 + col * 11, 88 + row * 11, 3, 0, 7); c.fill(); }
    vignette(c, FW, FH, 'rgba(0,4,14,A)', .6);
    return r[0];
  }
  /* Era 5 – neon social-media phone */
  function era5(){
    var r = mk(FW, FH), c = r[1];
    paint(c, ALL, BOX, '#1a0a28', ['#2c0f45','#120620','#3d1660','#24103a'], 280, 16, .2, 1.5);
    c.fillStyle = '#12061e'; c.beginPath(); rrect(c, 72, 12, 86, 120, 14); c.fill();
    c.save(); c.shadowColor = '#ff5cbf'; c.shadowBlur = 12; c.strokeStyle = '#ff6ccb'; c.lineWidth = 4; c.beginPath(); rrect(c, 72, 12, 86, 120, 14); c.stroke(); c.restore();
    c.save(); c.shadowColor = '#4ff2ff'; c.shadowBlur = 10; c.fillStyle = '#4ff2ff'; c.beginPath(); c.moveTo(104, 52); c.lineTo(104, 86); c.lineTo(132, 69); c.closePath(); c.fill();
    c.fillRect(86, 108, 58, 4); c.restore();
    c.fillStyle = '#ff6ccb'; c.fillRect(86, 108, 24, 4);
    [[38, 38, 13, '#ff4fb8'], [194, 52, 11, '#ff8ad6'], [32, 104, 10, '#ff8ad6'], [198, 112, 14, '#ff4fb8']].forEach(function(h){
      c.save(); c.shadowColor = h[3]; c.shadowBlur = 10; c.fillStyle = h[3]; c.beginPath(); heart(c, h[0], h[1], h[2]); c.fill(); c.restore();
    });
    c.fillStyle = '#4ff2ff'; [[190, 22, 4], [44, 70, 3], [176, 86, 3]].forEach(function(d){ c.beginPath(); c.arc(d[0], d[1], d[2], 0, 7); c.fill(); });
    vignette(c, FW, FH, 'rgba(6,0,12,A)', .55);
    return r[0];
  }
  var frames = [era1(), era2(), era3(), era4(), era5()];
  window.ERA_FRAMES = frames;

  /* Film strip tile: five era frames + sprocket holes */
  var TW = 1240, TH = 210, tr = mk(TW, TH), tile = tr[0], t = tr[1];
  paint(t, function(p){ p.rect(0, 0, TW, TH); }, [0, 0, TW, TH], '#140d09', ['#21160f','#0c0806','#2a1c13'], 900, 26, 0, .08);
  t.fillStyle = 'rgba(236,222,194,.88)';
  for (var x = 6; x < TW; x += 31){ t.beginPath(); rrect(t, x, 8, 18, 16, 3); rrect(t, x, 186, 18, 16, 3); t.fill(); }
  t.font = '700 9px Arial'; t.textBaseline = 'middle';
  frames.forEach(function(f, k){
    var fx = k * 248 + 9;
    t.fillStyle = '#050302'; t.fillRect(fx - 3, 32, FW + 6, FH + 6);
    t.drawImage(f, fx, 35);
    t.fillStyle = 'rgba(232,176,74,.85)'; t.fillText('◆ ERA ' + (k + 1) + ' ◆', fx + 6, 180);
  });
  t.fillStyle = 'rgba(255,255,255,.07)'; t.fillRect(0, 29, TW, 2); t.fillRect(0, 179, TW, 1);

  /* Film reel */
  var rr2 = mk(360, 360), reel = rr2[0], rc = rr2[1];
  paint(rc, function(p){ p.arc(180, 180, 176, 0, Math.PI * 2); }, [4, 4, 352, 352], '#5d5a57', ['#8a8682','#45423f','#a9a49d','#6c6864'], 900, 18, 0, Math.PI);
  rc.fillStyle = '#0c0907';
  for (var k = 0; k < 6; k++){ var a = k * Math.PI / 3; rc.beginPath(); rc.arc(180 + Math.cos(a) * 112, 180 + Math.sin(a) * 112, 36, 0, Math.PI * 2); rc.fill(); }
  paint(rc, function(p){ p.arc(180, 180, 46, 0, Math.PI * 2); }, [134, 134, 92, 92], '#8e8a85', ['#b9b4ad','#6a6662','#d1ccc4'], 120, 8, 0, Math.PI);
  rc.fillStyle = '#0c0907'; rc.beginPath(); rc.arc(180, 180, 11, 0, Math.PI * 2); rc.fill();
  for (k = 0; k < 3; k++){ a = k * Math.PI * 2 / 3; rc.fillRect(180 + Math.cos(a) * 11 - 3, 180 + Math.sin(a) * 11 - 3, 6, 6); }
  rc.strokeStyle = 'rgba(255,255,255,.28)'; rc.lineWidth = 4; rc.beginPath(); rc.arc(180, 180, 170, -2.6, -1.2); rc.stroke();
  rc.strokeStyle = 'rgba(0,0,0,.5)'; rc.lineWidth = 5; rc.beginPath(); rc.arc(180, 180, 174, 0, Math.PI * 2); rc.stroke();

  /* Painted backdrop */
  var br = mk(1920, 1080), base = br[0], b = br[1];
  var gr = b.createLinearGradient(0, 0, 1920, 1080); gr.addColorStop(0, '#1d130e'); gr.addColorStop(.5, '#221319'); gr.addColorStop(1, '#150d0b');
  paint(b, function(p){ p.rect(0, 0, 1920, 1080); }, [0, 0, 1920, 1080], gr, ['#2c1b14','#2e1824','#3b2519','#1a0f12','#3c2131','#24160f'], 2800, 60, -.3, .6);
  vignette(b, 1920, 1080, 'rgba(0,0,0,A)', .6);

  function strip(cy, ang, sc, off, dir){
    g.save(); g.translate(960, cy); g.rotate(ang); g.scale(sc, sc);
    var span = 1920 / sc / 2 + 300, n = Math.ceil(span / TW) + 1, x0 = -n * TW + (dir > 0 ? off : -off);
    for (var x = x0; x < span; x += TW) g.drawImage(tile, x, -TH / 2);
    g.restore();
  }
  function spinReel(x, y, sc, rot){ g.save(); g.translate(x, y); g.rotate(rot); g.scale(sc, sc); g.drawImage(reel, -180, -180); g.restore(); }

  var last = 0, off1 = 0, off2 = 0, rot = 0;
  function frame(ts){
    requestAnimationFrame(frame);
    if (ts - last < 33) return;
    var dt = Math.min(.1, (ts - last) / 1000); last = ts;
    off1 = (off1 + dt * 28) % TW; off2 = (off2 + dt * 22) % TW; rot += dt * .22;
    g.drawImage(base, 0, 0);
    spinReel(1808, 92, .95, rot);
    spinReel(96, 1010, .78, -rot * 1.2);
    strip(96, -.035, .62, off1, -1);
    strip(1030, .022, .55, off2, 1);
    for (var i = 0; i < 34; i++){ g.fillStyle = 'rgba(255,240,215,' + rr(.04, .14).toFixed(2) + ')'; g.fillRect(rr(0, 1920), rr(0, 1080), rr(1, 3), rr(1, 3)); }
    if (Math.random() < .04){ g.fillStyle = 'rgba(255,240,215,.07)'; g.fillRect(rr(0, 1920), 0, 1.5, 1080); }
  }
  requestAnimationFrame(frame);
})();

eraImgs.forEach(function(img, e){ img.src = window.ERA_FRAMES[e].toDataURL('image/png'); });
</script>
