<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In-Class Activities</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0a24;--card:#fffaf0;--ink:#14161f;--gold:#f2b134;--pink:#ff4f8b;--muted:#5a5f72}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;font-family:'Atkinson Hyperlegible',Arial,sans-serif;color:#fff;
    background:radial-gradient(circle at 20% 10%,#3a1f80 0,transparent 45%),radial-gradient(circle at 85% 90%,#5a0f3a 0,transparent 45%),var(--bg);
    padding:48px 24px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-family:'Bungee',Impact,sans-serif;font-weight:400;font-size:clamp(34px,6vw,64px);line-height:1;text-shadow:0 4px 0 #b3123a}
  h1 em{font-style:normal;color:var(--gold);text-shadow:0 4px 0 #8a4a00}
  .sub{margin:12px 0 34px;font-size:19px;color:#d6d2f0}
  .tabs{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap}
  .tab{font:inherit;font-weight:700;font-size:18px;padding:10px 24px;border-radius:999px;border:2px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer}
  .tab.on{background:var(--gold);border-color:var(--gold);color:#1a1205}
  .unit{margin-bottom:28px}
  .unit h2{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  a.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);border-radius:18px;padding:22px 24px;border-left:8px solid var(--pink);
    box-shadow:0 14px 34px rgba(0,0,0,.45);transition:transform .15s}
  a.card:hover,a.card:focus-visible{transform:translateY(-4px);outline:none;box-shadow:0 0 0 4px var(--gold),0 14px 34px rgba(0,0,0,.45)}
  a.card h3{font-size:24px;margin-bottom:6px}
  a.card p{color:var(--muted);font-size:16px}
  .empty{color:#d6d2f0;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>In-Class <em>Activities</em></h1>
  <p class="sub">Choose a grade, Instructions or Test Review, then pick an activity.</p>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>
<script>
/* Add new activities here: tab ('G9', 'G10' or 'REVIEW'), grade, unit number, unit title, activity title, short description, folder path.
   Test reviews go in the REVIEW tab with paths under TEST-REVIEW/. */
var ACTIVITIES = [
  {tab:'G10', grade:'G10', unit:11, unitTitle:'Heroes', title:'Hero or Not?', desc:'Eight real-life dilemmas to discuss and vote on.', path:'G10/unit-11-heroes/hero-or-not/'},
  {tab:'G10', grade:'G10', unit:13, unitTitle:'Success and fame', title:'Spin & Speak', desc:'Spin the wheel for a star word, then name a famous person who fits it.', path:'G10/unit-13-success-and-fame/spin-and-speak/'},
  {tab:'G10', grade:'G10', unit:13, unitTitle:'Success and fame', title:'Word Stars', desc:'Talent-show audition: is the star word the right part of speech? Vote, then fix it.', path:'G10/unit-13-success-and-fame/word-stars/'},
  {tab:'G10', grade:'G10', unit:13, unitTitle:'Success and fame', title:'Lights, Camera, Adverb!', desc:'Adverb charades: act out the action, then spell the -ly adverb on the board.', path:'G10/unit-13-success-and-fame/lights-camera-adverb/'},
  {tab:'INSTRUCT', grade:'G10', unit:13, unitTitle:'Success and fame', title:'Fame Through the Decades', desc:'Project instructions: research, essay, presentation and timeline.', path:'INSTRUCTIONS/G10/unit-13-success-and-fame/fame-through-the-decades/'},
  {tab:'REVIEW', grade:'G9', unit:2, unitTitle:'Technology', title:'Unit 2 Test Review', desc:'Walk through the Unit 2 test with step-by-step answers and evidence.', path:'TEST-REVIEW/G9/unit-02-technology/'},
  {tab:'REVIEW', grade:'G10', unit:13, unitTitle:'Success and fame', title:'Unit 13 Test Review: Reading', desc:'The reading exercise, with note windows that cross out the words a short note doesn\u2019t need.', path:'TEST-REVIEW/G10/unit-13-success-and-fame/'}
];
var TABS = [{id:'G9',label:'Grade 9'},{id:'G10',label:'Grade 10'},{id:'INSTRUCT',label:'Instructions'},{id:'REVIEW',label:'Test Review'}];
var IDS = TABS.map(function(t){ return t.id; });
var tabs = document.getElementById('tabs'), list = document.getElementById('list');
var saved; try{ saved = localStorage.getItem('inclassGrade'); }catch(e){}
var current = IDS.indexOf(saved) > -1 ? saved : 'G9';
function render(){
  tabs.textContent = '';
  TABS.forEach(function(t){
    var g = t.id, b = document.createElement('button');
    b.className = 'tab' + (g === current ? ' on' : '');
    b.textContent = t.label;
    b.onclick = function(){ current = g; try{ localStorage.setItem('inclassGrade', g); }catch(e){} render(); };
    tabs.appendChild(b);
  });
  list.textContent = '';
  var items = ACTIVITIES.filter(function(a){ return a.tab === current; }).sort(function(a,b){ return (parseInt(a.grade.slice(1)) - parseInt(b.grade.slice(1))) || (a.unit - b.unit); });
  if(!items.length){ var p = document.createElement('p'); p.className = 'empty'; p.textContent = current === 'REVIEW' ? 'No test reviews yet.' : current === 'INSTRUCT' ? 'No instructions yet.' : 'No activities yet.'; list.appendChild(p); return; }
  var units = {};
  var order = [];
  items.forEach(function(a){ var k = a.grade + '-' + a.unit; if(!units[k]){ units[k] = []; order.push(k); } units[k].push(a); });
  order.forEach(function(u){
    var sec = document.createElement('section'); sec.className = 'unit';
    var h = document.createElement('h2'); var f = units[u][0]; h.textContent = (current === 'REVIEW' || current === 'INSTRUCT' ? 'Grade ' + f.grade.slice(1) + ' · ' : '') + 'Unit ' + f.unit + ' · ' + f.unitTitle; sec.appendChild(h);
    var grid = document.createElement('div'); grid.className = 'grid';
    units[u].forEach(function(a){
      var c = document.createElement('a'); c.className = 'card'; c.href = a.path;
      var t = document.createElement('h3'); t.textContent = a.title;
      var d = document.createElement('p'); d.textContent = a.desc;
      c.appendChild(t); c.appendChild(d); grid.appendChild(c);
    });
    sec.appendChild(grid); list.appendChild(sec);
  });
}
render();
</script>
</body>
</html>
